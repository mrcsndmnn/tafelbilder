<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Suchmaschinen sollen diese Seite nicht aufnehmen -->
<meta name="robots" content="noindex, nofollow">
<title>Übungsrunde</title>
<link rel="stylesheet" href="../silben.css">
<link rel="stylesheet" href="runde.css?v=2026112701">
</head>
<body>
<!-- Einrichtung -->
<main class="ein" id="einrichtung" hidden>
  <div class="ein-kopf">
    <a class="zurueck-link" id="zurThema" href="../../"><span aria-hidden="true">←</span> Zur Themenseite</a>
    <div class="vorlagen" id="vorlagen" hidden><span class="lbl">Vorlagen:</span></div>
  </div>
  <h1><svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M34 14 A13 13 0 0 0 10 16"/><path d="M10 9 V16 H17"/><path d="M10 30 A13 13 0 0 0 34 28"/><path d="M34 35 V28 H27"/><path d="M22 15.5 L24 20 L28.8 20.4 L25.2 23.6 L26.3 28.3 L22 25.8 L17.7 28.3 L18.8 23.6 L15.2 20.4 L20 20 Z" fill="currentColor" stroke-width="1.5"/></svg><span>Übungsrunde: <span id="themaTitel">…</span></span></h1>
  <p class="unter">Tafelbilder wählen, Kinder und Durchgänge einstellen – die Übungsrunde reiht Aufgaben aneinander und achtet darauf, dass jedes Kind gleich oft drankommt.</p>
  <div id="ladeFehler" class="bereich" hidden></div>
  <form id="form" onsubmit="return false"></form>
  <footer><a href="../../impressum.html">Impressum</a> · <a href="../../datenschutz.html">Datenschutz</a></footer>
</main>

<!-- Rundenrahmen -->
<div class="runde" id="runde" hidden>
  <div class="r-kopf">
    <span class="thema" id="rThema"></span>
    <div class="fortschritt"><span class="text" id="rText"></span><div class="balken" aria-hidden="true"><i id="rBalken"></i><b>★</b></div></div>
    <div class="punkte" id="rPunkte" hidden></div>
    <button type="button" class="kn" id="rMenue" aria-haspopup="true" aria-expanded="false" aria-label="Menü"><span class="ico" aria-hidden="true">☰</span></button>
  </div>
  <div class="band silben" aria-live="polite">
    <div class="wer" id="rWer"></div><span class="dots" id="rDots"></span><span class="info" id="rInfo"></span>
    <div class="platz"></div>
    <button type="button" class="kn" id="rAnderes">Anderes Kind</button>
  </div>
  <div class="buehne" id="rBuehne"><iframe id="rFrame" title="Tafelbild"></iframe></div>
  <div class="r-fuss">
    <button type="button" class="kn" id="rNeu">Neue Aufgabe</button>
    <button type="button" class="kn" id="rJoker">Joker: Freund fragen</button>
    <button type="button" class="kn" id="rHilfe" aria-pressed="false">Hilfe</button>
    <div class="platz"></div>
    <button type="button" class="kn haupt" id="rWeiter">Fertig → Nächste</button>
  </div>
</div>

<!-- Abschluss -->
<main class="ende silben" id="ende" hidden></main>

<script src="../silben.js"></script>
<script type="module" src="runde.js?v=2026112701"></script>
</body>
</html>
