<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Suchmaschinen sollen diese Seite nicht aufnehmen -->
<meta name="robots" content="noindex, nofollow">
<title>Platzhalter-Tafelbild</title>
<style>
:root{--bg:#fbfcfb;--ink:#1d2320}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1f2622;--ink:#e8eee9}}
:root[data-theme="dark"]{--bg:#1f2622;--ink:#e8eee9}
body{margin:0;background:var(--bg);color:var(--ink);font:22px/1.4 "Segoe UI",system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:16px}
.kopf{background:#e3e7e4;padding:10px;border-radius:10px;margin-bottom:20px}
.aufgabe{font-size:64px;font-weight:700;margin:10px 0}
button{font:inherit;min-height:64px;min-width:120px;margin:6px;border:3px solid currentColor;border-radius:14px;background:transparent;color:inherit;cursor:pointer}
.hilfe{color:#2f7d4f}
</style>
</head>
<body>
<div>
  <div class="kopf">Kopfleiste (im Rundenmodus ausgeblendet)</div>
  <div>Platzhalter-Tafelbild <span id="art"></span> · Niveau <span id="niv">–</span></div>
  <div class="aufgabe" id="aufgabe">…</div>
  <div class="hilfe" id="hilfe" hidden>Hilfe ist an</div>
  <div id="knoepfe"></div>
  <p id="info"></p>
</div>
<script src="../../runde-client.js"></script>
<script>
// Ein einfaches Tafelbild zum Testen der Nachrichten: Rechenaufgabe, zwei Antworten
const b = new URLSearchParams(location.search).get("b") === "1";
document.getElementById("art").textContent = b ? "B (Lehrkraft prüft)" : "A (prüft selbst)";
let fehler = 0;
function neueAufgabe(niveau, aus) {
  let a, c, id, n = 0;
  do { a = 1 + Math.floor(Math.random() * 5 * niveau); c = 1 + Math.floor(Math.random() * 5 * niveau); id = `p${b ? "b" : "a"}-${a}+${c}`; } while (aus.includes(id) && ++n < 50);
  fehler = 0; document.getElementById("niv").textContent = niveau;
  document.getElementById("aufgabe").textContent = `${a} + ${c} = ?`;
  const k = document.getElementById("knoepfe"); k.innerHTML = "";
  if (!b) [a + c, a + c + 1].sort(() => Math.random() - .5).forEach(w => { const x = document.createElement("button"); x.textContent = w;
    x.onclick = () => { if (w === a + c) { document.getElementById("info").textContent = "Richtig!"; Runde.fertig({ ohneFehler: fehler === 0 }); } else { fehler++; document.getElementById("info").textContent = "Noch nicht."; } }; k.appendChild(x); });
  document.getElementById("info").textContent = "";
  Runde.gestartet(id);
}
Runde.verbinde({ id: b ? "platzhalter-b" : "platzhalter", neueAufgabe, hilfe: an => { document.getElementById("hilfe").hidden = !an; } });
if (!Runde.aktiv) neueAufgabe(1, []);
</script>
</body>
</html>
