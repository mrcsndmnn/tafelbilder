<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Suchmaschinen sollen diese Seite nicht aufnehmen -->
<meta name="robots" content="noindex, nofollow">
<title>Tafelbilder</title>
<meta name="description" content="Interaktive Tafelbilder für den Unterricht, nach Fach und Thema sortiert.">
<style>
/* Schrift: Andika wird lokal geladen, nicht über Google Fonts (Datenschutz).
   Dazu die Dateien Andika-Regular.woff2 und Andika-Bold.woff2 in den Ordner "fonts" legen.
   Fehlen sie, wird automatisch eine Systemschrift verwendet. */
@font-face{font-family:"Andika";src:url("fonts/Andika-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Andika";src:url("fonts/Andika-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

:root{
  --bg:#f4f7f4; --card:#ffffff; --ink:#1d2320; --soft:#5d6862; --line:#d5ddd7; --accent:#2f7d4f;
  --deutsch:#b0552f; --deutsch-bg:#f8e9e2;
  --mathe:#2f6fb0;   --mathe-bg:#e4eef8;
  --su:#7a4fa8;      --su-bg:#efe7f7;
  --ueber:#2f7d7a;   --ueber-bg:#e0f2f1;
  --font:"Andika","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151a17; --card:#1f2622; --ink:#e8eee9; --soft:#a9b4ad; --line:#334039; --accent:#6cc28f;
  --deutsch:#e89a78; --deutsch-bg:#3a2820;
  --mathe:#7fb0e6;   --mathe-bg:#1e2c3b;
  --su:#b99ae0;      --su-bg:#2c2338;
  --ueber:#7fd0cb;   --ueber-bg:#1d3331;
  color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:32px 16px 56px}
header h1{font-size:clamp(30px,5vw,42px);margin:0 0 4px}
header p{margin:0;color:var(--soft);max-width:60ch}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 6px;align-items:center}
.tools input{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);flex:1 1 240px;min-width:0}
.filter{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px 0 0}
.flabel{font-size:15px;font-weight:700;color:var(--soft);min-width:58px}
.chips{display:flex;gap:8px;align-items:flex-start;min-width:0}
.chips .dyn{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
/* „Alle“ steht für sich, durch einen Strich von den einzeln wählbaren Optionen getrennt */
.chips .trenn{flex:none;width:2px;height:30px;margin:6px 6px 0;border-radius:2px;background:var(--line)}
.chip{font:inherit;font-size:16px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip{flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Einzeln wählbare Optionen zeigen ein Häkchen, wenn sie gewählt sind (mehrere möglich) */
.dyn .chip[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
.tools input:focus-visible,.chip:focus-visible,a.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fach{margin-top:28px}
/* Fach-Überschrift als Klapp-Knopf (Akkordeon) */
.fach>h2{margin:0;font-size:clamp(20px,5.4vw,26px)}
.fkopf{display:flex;align-items:center;gap:clamp(8px,2.5vw,12px);width:100%;min-width:0;font:inherit;font-weight:700;color:var(--ink);background:var(--card);
  border:2px solid var(--line);border-radius:14px;padding:10px clamp(12px,3vw,16px);cursor:pointer;text-align:left}
.fkopf:hover{border-color:var(--fc)}
.fkopf:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fkopf .dot{width:14px;height:14px;border-radius:50%;background:var(--fc);flex:none}
.fkopf .titel{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:clamp(8px,2.5vw,12px);min-width:0;flex:1}
.fkopf .anzahl{font-size:15px;font-weight:400;color:var(--soft);white-space:nowrap}
.fkopf .pfeil{width:12px;height:12px;border-right:3px solid var(--soft);border-bottom:3px solid var(--soft);
  transform:rotate(45deg);margin-top:-6px;margin-right:4px;transition:transform .15s,margin .15s;flex:none}
.fkopf[aria-expanded="false"] .pfeil{transform:rotate(-45deg);margin-top:0}
.inhalt{padding:0 4px 4px}
.inhalt[hidden]{display:none}
.thema h3{font-size:19px;margin:14px 0 8px}
/* Themen-Überschrift zum Auf- und Zuklappen: − = aufgeklappt, + = zugeklappt */
.tkopf{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px 4px 2px;font:inherit;font-weight:700;color:var(--soft);
  background:none;border:none;border-radius:10px;cursor:pointer;text-align:left}
.tkopf:hover{color:var(--ink)}
.tkopf:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tkopf .pm{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--fc);color:var(--fc);font-size:22px;line-height:1}
.tkopf .tanz{font-size:14px;font-weight:400;white-space:nowrap}
.tgrid[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
a.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;min-width:0;transition:border-color .15s,transform .15s}
a.tile:hover{border-color:var(--fc);transform:translateY(-2px)}
.top{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--fbg)}
.tag.runde{background:#e3f2e8;color:#1f6a3a;font-weight:700}
.tag.klasse{background:transparent;border:1.5px solid var(--line);color:var(--soft)}
.tile strong{font-size:21px;line-height:1.25}
.desc{color:var(--soft);font-size:16px}
.go{margin-top:auto;font-weight:700;color:var(--fc)}
.empty{color:var(--soft);margin-top:32px}
footer{margin-top:48px;color:var(--soft);font-size:14px;border-top:1px solid var(--line);padding-top:16px}
footer a{color:inherit}
.f-deutsch{--fc:var(--deutsch);--fbg:var(--deutsch-bg)}
.f-mathe{--fc:var(--mathe);--fbg:var(--mathe-bg)}
.f-su{--fc:var(--su);--fbg:var(--su-bg)}
.f-uebergreifend{--fc:var(--ueber);--fbg:var(--ueber-bg)}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion: reduce){a.tile{transition:none}a.tile:hover{transform:none}.fkopf .pfeil{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tafelbilder</h1>
    <p>Interaktive Tafelbilder und passende Materialien, nach Fach und Thema sortiert.</p>
  </header>

  <div class="tools">
    <label for="q" class="sr">Suchen</label>
    <input id="q" type="search" placeholder="Suchen, z. B. Brief">
  </div>
  <div class="filter">
    <span class="flabel" id="l-fach">Fach</span>
    <div id="chips" class="chips" role="group" aria-labelledby="l-fach"></div>
  </div>
  <div class="filter">
    <span class="flabel" id="l-klasse">Klasse</span>
    <div id="kchips" class="chips" role="group" aria-labelledby="l-klasse"></div>
  </div>

  <main id="list"></main>
  <p class="empty" id="empty" hidden>Nichts gefunden. Probiere ein anderes Wort oder einen anderen Filter.</p>

  <footer>
    Tipp: Tafelbild öffnen und mit F11 auf Vollbild schalten.
    <br><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a>
  </footer>
</div>

const list = document.getElementById("list");
const q = document.getElementById("q");
const empty = document.getElementById("empty");
const fachAuswahl = new Set(), klasseAuswahl = new Set();   // leer = „Alle“

const klassenVon = e => [].concat(e.klasse || []);
const vorhanden = [...new Set(EINTRAEGE.map(e => e.fach))];
const alleKlassen = EINTRAEGE.flatMap(klassenVon);
const vorhandeneKlassen = [...KLASSEN.filter(k => alleKlassen.includes(k)),
                           ...new Set(alleKlassen.filter(k => !KLASSEN.includes(k)))];

// Filter-Knöpfe: „Alle“ für sich, daneben die Optionen, die sich beliebig kombinieren lassen
function knoepfe(ziel, eintraege, auswahl){
  const box = document.getElementById(ziel);
  const knopf = (label, cls) => { const b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = label; return b; };
  const alle = knopf("Alle", "chip alle");
  const trenn = document.createElement("span"); trenn.className = "trenn"; trenn.setAttribute("aria-hidden", "true");
  const dyn = document.createElement("div"); dyn.className = "dyn";
  box.append(alle, trenn, dyn);
  const kn = eintraege.map(([key, label]) => {
    const b = knopf(label, "chip");
    b.onclick = () => { auswahl.has(key) ? auswahl.delete(key) : auswahl.add(key); zeige(); render(); };
    dyn.appendChild(b); return [key, b];
  });
  alle.onclick = () => { auswahl.clear(); zeige(); render(); };
  const zeige = () => {
    alle.setAttribute("aria-pressed", auswahl.size === 0);
    kn.forEach(([k, b]) => b.setAttribute("aria-pressed", auswahl.has(k)));
  };
  zeige();
}
knoepfe("chips", vorhanden.map(f => [f, FAECHER[f] || f]), fachAuswahl);
knoepfe("kchips", vorhandeneKlassen.map(k => [k, k]), klasseAuswahl);

// Zugeklappte Fächer merken (nur in diesem Browser)
let zu = new Set();
try { zu = new Set(JSON.parse(localStorage.getItem("uebersicht-zu") || "[]")); } catch (e) {}
const merken = () => { try { localStorage.setItem("uebersicht-zu", JSON.stringify([...zu])); } catch (e) {} };
// Zugeklappte Themen merken (Schlüssel „fach|thema“)
let themaZu = new Set();
try { themaZu = new Set(JSON.parse(localStorage.getItem("uebersicht-themen-zu") || "[]")); } catch (e) {}
const themenMerken = () => { try { localStorage.setItem("uebersicht-themen-zu", JSON.stringify([...themaZu])); } catch (e) {} };
let themaNr = 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const s = q.value.trim().toLowerCase();
  const hits = EINTRAEGE.filter(e => {
    const kl = klassenVon(e);
    return (!fachAuswahl.size || fachAuswahl.has(e.fach)) &&
      (!klasseAuswahl.size || kl.some(k => klasseAuswahl.has(k)) || kl.includes("übergreifend")) &&
      (!s || [e.titel, e.thema, e.beschreibung, e.art, kl.join(" "), FAECHER[e.fach]].join(" ").toLowerCase().includes(s));
  });
  list.innerHTML = "";
  empty.hidden = hits.length > 0;

  vorhanden.filter(f => hits.some(e => e.fach === f)).forEach(f => {
    const treffer = hits.filter(e => e.fach === f);
    const offen = !!s || !zu.has(f);   // beim Suchen immer aufgeklappt
    const sec = document.createElement("section");
    sec.className = "fach f-" + f;
    sec.innerHTML = `<h2><button type="button" class="fkopf" aria-expanded="${offen}" aria-controls="inhalt-${esc(f)}">
        <span class="dot"></span>
        <span class="titel"><span>${esc(FAECHER[f] || f)}</span>
          <span class="anzahl">${treffer.length} ${treffer.length === 1 ? "Material" : "Materialien"}</span></span>
        <span class="pfeil" aria-hidden="true"></span></button></h2>
      <div class="inhalt" id="inhalt-${esc(f)}"${offen ? "" : " hidden"}></div>`;
    const inhalt = sec.querySelector(".inhalt"), kopf = sec.querySelector(".fkopf");
    kopf.onclick = () => {
      const jetztOffen = kopf.getAttribute("aria-expanded") !== "true";
      kopf.setAttribute("aria-expanded", jetztOffen);
      inhalt.hidden = !jetztOffen;
      if (!s) { jetztOffen ? zu.delete(f) : zu.add(f); merken(); }
    };
    [...new Set(treffer.map(e => e.thema))].forEach(t => {
      const th = document.createElement("div");
      th.className = "thema";
      const tt = treffer.filter(e => e.thema === t), schl = f + "|" + t, tid = "thema-" + (++themaNr);
      const tOffen = !!s || !themaZu.has(schl);   // beim Suchen immer aufgeklappt
      th.innerHTML = `<h3><button type="button" class="tkopf" aria-expanded="${tOffen}" aria-controls="${tid}">
          <span class="pm" aria-hidden="true">${tOffen ? "−" : "+"}</span><span>${esc(t)}</span>
          <span class="tanz">${tt.length} ${tt.length === 1 ? "Material" : "Materialien"}</span></button></h3>
        <div class="grid tgrid" id="${tid}"${tOffen ? "" : " hidden"}>` +
        tt.map(e => `
          <a class="tile" href="${esc(e.url)}">
            <div class="top"><span class="tag">${esc(e.art)}</span>${e.runde ? `<span class="tag runde" title="Mit Übungsrunde"><span aria-hidden="true">↻★</span> Übungsrunde</span>` : ""}${klassenVon(e).map(k => `<span class="tag klasse">${esc(k)}</span>`).join("")}</div>
            <strong>${esc(e.titel)}</strong>
            <span class="desc">${esc(e.beschreibung)}</span>
            <span class="go">Öffnen →</span>
          </a>`).join("") + `</div>`;
      const tk = th.querySelector(".tkopf"), tg = th.querySelector(".tgrid");
      tk.onclick = () => {
        const auf = tk.getAttribute("aria-expanded") !== "true";
        tk.setAttribute("aria-expanded", auf); tg.hidden = !auf; tk.querySelector(".pm").textContent = auf ? "−" : "+";
        if (!s) { auf ? themaZu.delete(schl) : themaZu.add(schl); themenMerken(); }
      };
      inhalt.appendChild(th);
    });
    list.appendChild(sec);
  });
}
q.addEventListener("input", render);
render();
