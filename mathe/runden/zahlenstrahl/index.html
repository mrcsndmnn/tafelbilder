<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Suchmaschinen sollen diese Seite nicht aufnehmen -->
<meta name="robots" content="noindex, nofollow">
<title>Zahlenstrahl-Lupe – Runden</title>
<link rel="stylesheet" href="../../zahlenraum-1000/gemeinsam/tafel.css?v=2026112802">
<link rel="stylesheet" href="../gemeinsam/runden.css?v=2026112802">
<link rel="stylesheet" href="../../../gemeinsam/lehrkraftmenue.css?v=2026112802">
<style>
.strahl text{font-family:var(--font);font-weight:700;fill:var(--ink);text-anchor:middle}
.strahl .achse,.strahl .st{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.strahl .klein{font-size:26px;fill:#8d9892;font-weight:400}
.strahl .nb rect{fill:#fff;stroke:var(--ink);stroke-width:3}
.strahl .nb text{font-size:60px;dominant-baseline:central}
.strahl .nb{cursor:pointer}
.strahl .nb:hover rect{fill:#f3f5f4}
.strahl .nb:focus{outline:none}.strahl .nb:focus-visible rect{stroke-width:6}
.strahl .nb.richtig rect{stroke:var(--ok);stroke-width:6}
.strahl .punkt{fill:var(--ink)}
.strahl .bogen{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;transition:opacity .4s}
.strahl .bogen.lang{opacity:.18}
.strahl .zaehl{font-size:24px;fill:#8d9892;font-weight:400}
.strahl .griff{cursor:grab;touch-action:none}
.strahl .ganz .st{stroke:#9aa39e;stroke-width:2}
.strahl .ganz text{font-size:20px;fill:#8d9892;font-weight:400}
.strahl .mittel{stroke:#9aa39e;stroke-width:2;stroke-dasharray:8 8}
.strahl .abauf{font-size:28px;fill:#6d7772;font-weight:700}
.zahlmarke{position:absolute;width:400px;text-align:center;pointer-events:none}
.gleichung-mitte{position:absolute;left:0;width:1600px;text-align:center;font-size:88px;font-weight:700;line-height:1}
.gleichung-mitte .ca{margin:0 .2em}
.abmachung{position:absolute;padding:8px 18px;border:3px solid var(--ink);border-radius:12px;font-size:26px;font-weight:700;background:#fff}
</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<script>
window.HINWEISE = {
 titel: "Zahlenstrahl-Lupe: Wo ist es näher?",
 teile: [
  { h: "Worum geht es?", text: "Runden heißt: zum näheren Nachbarn gehen. Die Kinder erleben das am Zahlenstrahl. Das Tafelbild dient zum Vertiefen, die Einführung übernimmt „Runden Schritt für Schritt“." },
  { h: "So geht es", punkte: [
    "Die Zahl steht als Punkt auf dem Ausschnitt. Beschriftet sind nur die beiden Nachbarn.",
    "Die Kinder tippen den näheren Nachbarn an. Danach hüpft der Punkt zu beiden Seiten. Der kürzere Weg bleibt stehen, der längere verblasst. Darunter erscheint die Gleichung.",
    "**Weiter** (unten rechts) stellt die nächste Zahl." ] },
  { h: "Im Lehrkraftmenü", punkte: [
    "**Runden auf** Zehner oder Hunderter, **Stufe** 1 (weg von der Mitte), 2 (alle Zahlen), 3 (Sonderfälle).",
    "**Selbst schieben**: Die Zahl mit dem Finger verschieben, die Gleichung passt sich an.",
    "Hilfen: **Alle Zahlen zeigen**, **Ganzen Zahlenstrahl zeigen**, **Einerziffer zeigen** (Grenze zwischen ab und auf). **Satzmuster** zeigt die Zahlen beim Hüpfen.",
    "**Die Mitte zeigen**: eine Zahl genau in der Mitte – Abmachung: aufrunden." ] } ]
};
</script>
<script src="../../../gemeinsam/uebungsrunde/runde-client.js?v=2026112802"></script>
<script src="../../zahlenraum-1000/gemeinsam/tafel.js?v=2026112802"></script>
<script src="../../../gemeinsam/lehrkraftmenue.js?v=2026112802"></script>
<script src="../gemeinsam/runden.js?v=2026112802"></script>
<script>
const T = Tafel, R = Runden, S = T.buehne(), ns = "http://www.w3.org/2000/svg";
let st = "Z", stufe = 1, n = 442, win = { u: 440, o: 450 }, phase = "frage", schieben = false, rf = 0;
let alleZahlen = false, ganzer = false, ziffer = false;
const el = (tag, a, txt) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };

// ---------- Kinderansicht ----------
const auftrag = T.blk(60, 34, 1300, 0, "auftrag-zeile");
const svg = el("svg", { class: "strahl", width: 1600, height: 520, viewBox: "0 0 1600 520" }); T.blk(0, 110).appendChild(svg);
const marke = T.el("div", "zahlmarke zahl gross96"); S.appendChild(marke);
const gl = T.blk(0, 650, 1600, 0, "gleichung-mitte zahl");
const rueck = T.blk(100, 760, 1400, 0, "rueck");
const abm = T.el("div", "abmachung", "Abmachung: aufrunden"); abm.hidden = true; S.appendChild(abm);
const weiterKn = T.knopf("Weiter", () => neu(), "haupt"); weiterKn.dataset.runde = "aus";
T.kinderknoepfe(weiterKn);

// ---------- Lehrkraftmenü ----------
const stWahl = T.gruppe("Runden auf", [{ wert: "Z", text: "Zehner" }, { wert: "H", text: "Hunderter" }], "Z", v => { st = v; zifferKn.lastChild.textContent = v === "Z" ? "Einerziffer zeigen" : "Zehnerziffer zeigen"; neu(); }, "rz-st");
const stufenWahl = T.gruppe("Stufe", [{ wert: 1, text: "1 weg von der Mitte" }, { wert: 2, text: "2 alle Zahlen" }, { wert: 3, text: "3 Sonderfälle" }], 1, v => { stufe = v; neu(); }, "rz-stufe");
st = stWahl.wert; stufe = stufenWahl.wert;
const schiebKn = T.schalter("Selbst schieben", false, v => { schieben = v; neu(n); });
const alleKn = T.schalter("Alle Zahlen zeigen", false, v => { alleZahlen = v; zeichne(); });
const ganzKn = T.schalter("Ganzen Zahlenstrahl zeigen", false, v => { ganzer = v; zeichne(); });
const zifferKn = T.schalter(st === "Z" ? "Einerziffer zeigen" : "Zehnerziffer zeigen", false, v => { ziffer = v; zeichne(); });
T.kopf({ menue: true, titel: "Zahlenstrahl-Lupe", beschreibung: "Welcher Nachbar ist näher? Hüpfen und vergleichen.",
  onNeu: () => neu(), onLoesung: () => zeigen(false), extra: [stWahl, stufenWahl, schiebKn], hilfen: [alleKn, ganzKn, zifferKn], onHilfen: () => zeichne() });
T.menue.steuer("Die Mitte zeigen", () => mitte());

// ---------- Zeichnen ----------
const AX = 260, XL = 160, XR = 1440, X0 = v => 100 + v * 1.4;
const Xd = v => XL + (v - win.u) * (XR - XL) / (win.o - win.u);
let ebeneBogen;
function zeichne() {
  svg.innerHTML = "";
  const b = R.BASIS[st], schritt = b / 10;
  if (ganzer) {   // kleiner Gesamtstrahl oben, ohne Lupen-Dreieck
    const g = el("g", { class: "ganz" }); svg.appendChild(g);
    g.appendChild(el("line", { class: "st", x1: X0(0), y1: 40, x2: X0(1000), y2: 40 }));
    for (let v = 0; v <= 1000; v += 100) { g.appendChild(el("line", { class: "st", x1: X0(v), y1: 30, x2: X0(v), y2: 50 })); g.appendChild(el("text", { x: X0(v), y: 76 }, v)); }
    g.appendChild(el("circle", { class: "punkt", cx: X0(n), cy: 40, r: 7 }));
  }
  svg.appendChild(el("line", { class: "achse", x1: XL - 60, y1: AX, x2: XR + 60, y2: AX }));
  for (let i = 0; i <= 10; i++) {
    const v = win.u + i * schritt, x = Xd(v), h = i === 0 || i === 10 ? 34 : i === 5 ? 26 : 18;
    svg.appendChild(el("line", { class: "st", x1: x, y1: AX - h, x2: x, y2: AX + h }));
    if (alleZahlen && i > 0 && i < 10) svg.appendChild(el("text", { class: "klein", x, y: AX + 64 }, v));
  }
  if (ziffer) {   // Grenze zwischen ab und auf (ohne Farben)
    const xm = (Xd(win.u + 4 * schritt) + Xd(win.u + 5 * schritt)) / 2;
    svg.appendChild(el("line", { class: "mittel", x1: xm, y1: AX - 120, x2: xm, y2: AX + 40 }));
    svg.appendChild(el("text", { class: "abauf", x: xm - 140, y: AX - 84 }, "← ab")); svg.appendChild(el("text", { class: "abauf", x: xm + 140, y: AX - 84 }, "auf →"));
    for (let i = 1; i < 10; i++) svg.appendChild(el("text", { class: "klein", x: Xd(win.u + i * schritt), y: AX - 44 }, i));
  }
  ebeneBogen = el("g"); svg.appendChild(ebeneBogen);
  // Nachbarn: groß, schwarz, schlichter Rahmen
  [["u", win.u], ["o", win.o]].forEach(([k, v]) => {
    const g = el("g", { class: "nb", "data-k": k, role: "button", tabindex: 0, "aria-label": "Nachbar " + v, transform: `translate(${Xd(v)},${AX + 110})` });
    g.innerHTML = `<rect x="-95" y="-46" width="190" height="92" rx="14"/><text>${v}</text>`;
    g.addEventListener("click", () => antwort(k)); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); antwort(k); } });
    svg.appendChild(g);
  });
  // Punkt mit der Zahl darüber
  const p = el("circle", { class: "punkt" + (schieben ? " griff" : ""), cx: Xd(n), cy: AX, r: schieben ? 22 : 16 }); svg.appendChild(p);
  marke.innerHTML = T.zahlHTML(n); marke.style.left = (Xd(n) - 200) + "px"; marke.style.top = (110 + AX - 215) + "px";
}

// ---------- Ablauf ----------
function neu(zahl) {
  T.stop(); rf = 0; abm.hidden = true; gl.innerHTML = ""; T.melde(rueck, "", "");
  let v = zahl; if (!v) { for (let i = 0; i < 50; i++) { v = R.zufallsZahl(st, stufe, n); if (!R.nachbarn(v, st).rund) break; } }
  n = v; win = R.nachbarn(n, st); if (win.rund) win = { u: n, o: n + R.BASIS[st] };
  phase = schieben ? "schieben" : "frage";
  auftrag.textContent = schieben ? "Schiebe die Zahl. Wohin wird gerundet?" : "Welcher Nachbar ist näher?";
  zeichne(); if (schieben) live();
}
function mitte() { schieben = false; schiebKn.setAttribute("aria-pressed", "false"); const b = R.BASIS[st]; neu((st === "Z" ? T.zufall(1, 99) * 10 : T.zufall(1, 9) * 100) + b / 2); }
function antwort(k) {
  if (phase !== "frage") return;
  const lu = n - win.u, lo = win.o - n;
  if (lu === lo) { zeigen(false); T.fertig(k === "o" && rf === 0); return; }
  if ((k === "u") === (lu < lo)) {
    svg.querySelector(`.nb[data-k="${k}"]`).classList.add("richtig");
    T.melde(rueck, "ok", `${T.lob()} ${n} liegt näher an ${k === "u" ? win.u : win.o}.`); zeigen(true); T.fertig(rf === 0);
  } else { rf++; T.melde(rueck, "noch", "Noch nicht. Zähle die Sprünge."); }
}
async function hupfe(ziel, lauf) {
  const b = st === "Z" ? 1 : 10, sgn = ziel < n ? -1 : 1; let a = n, gez = 0; const boegen = [];
  while (a !== ziel) {
    const nx = Math.abs(ziel - a) > b ? a + sgn * b : ziel, x1 = Xd(a), x2 = Xd(nx), h = Math.min(60, Math.abs(x2 - x1) * .55) + 10;
    const p = el("path", { class: "bogen", d: `M${x1},${AX - 6} Q${(x1 + x2) / 2},${AX - 6 - 2 * h} ${x2},${AX - 6}` }); ebeneBogen.append(p); boegen.push(p);
    gez += Math.abs(nx - a);
    if (T.hilfen()) ebeneBogen.append(el("text", { class: "zaehl", x: (x1 + x2) / 2, y: AX - h - 18 }, gez));
    a = nx; await T.warte(T.bewegt ? (st === "Z" ? 320 : 250) : 0); if (lauf !== T.lauf) return null;
  }
  return boegen;
}
async function zeigen(gelobt) {
  if (phase === "gezeigt" || schieben) return;
  phase = "gezeigt"; T.stop(); const lauf = T.lauf; ebeneBogen.innerHTML = "";
  const L = await hupfe(win.u, lauf); if (!L) return;
  const Rr = await hupfe(win.o, lauf); if (!Rr) return;
  const lu = n - win.u, lo = win.o - n;
  if (lu !== lo) (lu < lo ? Rr : L).forEach(p => p.classList.add("lang"));
  else { abm.hidden = false; abm.style.left = (Xd(n) - 150) + "px"; abm.style.top = (110 + AX + 60) + "px"; }
  gl.innerHTML = R.gleichung(n, R.runde(n, st)); gl.classList.remove("einblenden"); void gl.offsetWidth; gl.classList.add("einblenden");
  if (!gelobt) T.melde(rueck, "grau", lu === lo ? `${n} liegt genau in der Mitte. Wir runden auf.` : R.naeher(n, st));
}
function live() { gl.innerHTML = R.gleichung(n, R.runde(n, st)); T.melde(rueck, "grau", R.naeher(n, st)); }
// Selbst schieben: Punkt ziehen
let zieht = false;
svg.addEventListener("pointerdown", e => { if (!schieben || !e.target.closest(".griff")) return; zieht = true; try { svg.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); });
svg.addEventListener("pointermove", e => {
  if (!zieht) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const x = pt.matrixTransform(svg.getScreenCTM().inverse()).x;
  const v = Math.max(win.u, Math.min(win.o, Math.round(win.u + (x - XL) * (win.o - win.u) / (XR - XL))));
  if (v !== n && v >= 1) { n = v; zeichne(); live(); }
});
["pointerup", "pointercancel"].forEach(t => svg.addEventListener(t, () => { zieht = false; }));

if (!T.runde({ id: "zahlenstrahl", neu: s => { stufe = s; schieben = false; neu(); return `rz-${n}-${st}`; } })) neu();
</script>
</body>
</html>
