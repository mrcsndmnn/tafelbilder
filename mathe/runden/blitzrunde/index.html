<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Suchmaschinen sollen diese Seite nicht aufnehmen -->
<meta name="robots" content="noindex, nofollow">
<title>Blitzrunde – Runden</title>
<link rel="stylesheet" href="../../zahlenraum-1000/gemeinsam/tafel.css?v=2026112802">
<link rel="stylesheet" href="../gemeinsam/runden.css?v=2026112802">
<link rel="stylesheet" href="../../../gemeinsam/lehrkraftmenue.css?v=2026112802">
<style>
.mitte-zahl{position:absolute;left:0;width:1600px;top:170px;text-align:center;font-size:150px;font-weight:700;line-height:1.05;white-space:nowrap}
.mitte-zahl.gl{font-size:120px}
.optionen{position:absolute;left:0;width:1600px;top:440px;display:flex;justify-content:center;gap:40px}
.antwort{min-width:260px;min-height:110px;font-size:60px;border-width:3px;background:#fff}
.antwort.richtig{border-color:var(--ok);border-width:7px;color:var(--ink);background:#fff}
.antwort.weg{opacity:.3}
.zeitbalken{position:absolute;left:400px;width:800px;top:390px;height:8px;border-radius:4px;background:#eef1ef;overflow:hidden}
.zeitbalken div{height:100%;width:100%;background:#9aa39e}
.kleinberg{position:absolute;left:1180px;top:430px;width:380px}
</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<script>
window.HINWEISE = {
 titel: "Blitzrunde Runden",
 teile: [
  { h: "Worum geht es?", text: "Zehn schnelle Runden zum Üben: Zahl ansehen, Nachbarn wählen oder selbst runden." },
  { h: "So geht es", punkte: [
    "Oben steht die Frage, in der Mitte die Zahl, darunter die Antworten zum Antippen.",
    "Bei **Selbst** sagen die Kinder das Ergebnis, die Lehrkraft drückt **Lösung**.",
    "**Weiter** stellt die nächste Runde. Unten links steht klein „Runde x von 10“." ] },
  { h: "Im Lehrkraftmenü", punkte: [
    "**Stufe**: 1 nur Zehner, mit unterstrichener Ziffer. 2 Zehner und Hunderter. 3 mit Sonderfällen und einer dritten Antwort.",
    "**Art**: Wählen, Selbst, Zehner oder Hunderter?, gemischt. **Zeit**: aus, 5 s, 10 s. **Heftzahlen** mischt Zahlen aus dem Heft unter.",
    "Hilfen: **Ziffer unterstreichen** (auch ab Stufe 2), **Kleiner Berg** bei der Lösung. Mit **Farben** entfällt das Unterstreichen." ] } ]
};
</script>
<script src="../../../gemeinsam/uebungsrunde/runde-client.js?v=2026112802"></script>
<script src="../../zahlenraum-1000/gemeinsam/tafel.js?v=2026112802"></script>
<script src="../../../gemeinsam/lehrkraftmenue.js?v=2026112802"></script>
<script src="../gemeinsam/runden.js?v=2026112802"></script>
<script>
const T = Tafel, R = Runden, S = T.buehne();
const RUNDEN = 10;
const HEFTZAHLEN = [273, 456, 250, 499, 875, 922, 505, 750, 138, 255, 359, 229, 351, 258, 349, 275, 396, 47, 55, 950, 754, 458, 369];
let rf = 0, stufe = 1, art = "waehlen", zeit = 0, heft = T.laden("rblitz-heft", false), runde = 1, aufg = null, gezeigt = false, uhr = null, letzte = 0;
let unterstr = false, kleinBerg = false;

// ---------- Kinderansicht ----------
const auftrag = T.blk(60, 34, 1300, 0, "auftrag-zeile");
const zahlEl = T.blk(0, 170, 1600, 0, "mitte-zahl zahl");
const zeitEl = T.blk(400, 390, 800, 0, "zeitbalken"); zeitEl.innerHTML = "<div></div>";
const opt = T.blk(0, 440, 1600, 0, "optionen");
const rueck = T.blk(100, 640, 1400, 0, "rueck");
const bergBox = T.blk(1180, 430, 380, 0, "kleinberg");
const fort = T.blk(0, 0, 0, 0, "fortschritt"); fort.style.left = ""; fort.style.top = "";
const loesKn = T.knopf("Lösung", () => loesung());
const weiterKn = T.knopf("Weiter", () => weiter(), "haupt"); weiterKn.dataset.runde = "aus"; fort.dataset.runde = "aus";
T.kinderknoepfe(loesKn, weiterKn);

// ---------- Lehrkraftmenü ----------
const stufenWahl = T.gruppe("Stufe", [{ wert: 1, text: "1" }, { wert: 2, text: "2" }, { wert: 3, text: "3 Sonderfälle" }], 1, v => { stufe = v; start(); }, "rblitz-stufe");
const artWahl = T.gruppe("Art", [{ wert: "waehlen", text: "Wählen" }, { wert: "selbst", text: "Selbst" }, { wert: "zh", text: "Zehner oder Hunderter?" }, { wert: "mix", text: "gemischt" }], "waehlen", v => { art = v; start(); }, "rblitz-art");
const zeitWahl = T.gruppe("Zeit", [{ wert: 0, text: "aus" }, { wert: 5, text: "5 s" }, { wert: 10, text: "10 s" }], 0, v => { zeit = v; zeigeAufgabe(); }, "rblitz-zeit");
stufe = stufenWahl.wert; art = artWahl.wert; zeit = zeitWahl.wert;
const heftKn = T.schalter("Heftzahlen", heft, v => { heft = v; T.merken("rblitz-heft", v); });
const unterKn = T.schalter("Ziffer unterstreichen", false, v => { unterstr = v; zeigeZahl(); });
const bergKn = T.schalter("Kleiner Berg bei der Lösung", false, v => { kleinBerg = v; bergBox.hidden = !v || !gezeigt; });
T.kopf({ menue: true, titel: "Blitzrunde Runden", beschreibung: "Zehn schnelle Runden: wählen oder selbst runden.", satzmuster: false,
  onNeu: () => start(), onLoesung: () => loesung(), extra: [stufenWahl, artWahl, zeitWahl, heftKn], hilfen: [unterKn, bergKn], onFarben: () => zeigeZahl() });

// ---------- Aufgaben ----------
function zahl(st) {
  if (heft && Math.random() < .7) { const l = HEFTZAHLEN.filter(x => x !== letzte && (st === "Z" || x >= 11)); return T.wahl(l); }
  return R.zufallsZahl(st, stufe, letzte);
}
function neueAufgabe() {
  let a = art === "mix" ? T.wahl(stufe === 3 ? ["waehlen", "selbst", "zh"] : ["waehlen", "selbst"]) : art;
  for (let v = 0; v < 300; v++) {
    const st = stufe === 1 && a !== "zh" ? "Z" : T.wahl(["Z", "H"]);
    const n = zahl(st), r = R.runde(n, st);
    if (a === "zh" && (R.runde(n, "Z") === R.runde(n, "H") || n % 10 === 0)) continue;
    if (n === letzte) continue;
    const x = { art: a, st, n, r };
    if (a === "waehlen") {
      const nb = R.nachbarn(n, st), b = R.BASIS[st];
      let o = nb.rund ? [n, n + b] : [nb.u, nb.o];
      if (stufe === 3) { const abl = T.wahl([nb.u - b, nb.o + b, R.runde(n, R.ANDERE[st])].filter(z => z >= 0 && z <= 1000 && !o.includes(z))); if (abl != null) o.push(abl); }
      x.opt = o.sort((p, q) => p - q);
    }
    letzte = n; return x;
  }
}

// ---------- Ablauf ----------
const lupe = () => (stufe === 1 || unterstr) && !S.classList.contains("farben") && aufg.art !== "zh" ? aufg.st : null;
function zeigeZahl() {
  if (!aufg) return; const a = aufg;
  zahlEl.classList.toggle("gl", a.art === "zh" || gezeigt);
  if (gezeigt || a.art === "zh") zahlEl.innerHTML = R.gleichung(a.n, a.r, gezeigt ? lupe() : null);
  else zahlEl.innerHTML = R.zahl(a.n, lupe()) + (a.art === "selbst" ? '<span class="ca">≈</span>?' : "");
}
function fortschritt() {
  fort.innerHTML = `Runde ${Math.min(runde, RUNDEN)} von ${RUNDEN}`;
}
function stoppeUhr() { clearTimeout(uhr); uhr = null; const b = zeitEl.firstChild; b.style.transition = "none"; b.style.width = "100%"; }
addEventListener("pagehide", stoppeUhr);
function start() { runde = 1; weiterKn.disabled = false; aufg = neueAufgabe(); zeigeAufgabe(); }
function zeigeAufgabe() {
  stoppeUhr(); gezeigt = false; const a = aufg;
  opt.innerHTML = ""; T.melde(rueck, "", ""); bergBox.hidden = true; bergBox.innerHTML = "";
  if (a.art === "zh") {
    auftrag.textContent = "Auf Zehner oder Hunderter gerundet?";
    ["Z", "H"].forEach(k => { const b = T.knopf(R.NAME[k], () => antwortZH(k, b), "antwort"); opt.appendChild(b); });
  } else if (a.art === "selbst") auftrag.textContent = `Runde auf ${R.NAME[a.st]}.`;
  else {
    auftrag.textContent = `Auf welchen ${R.NAME[a.st].replace(/n$/, "")} wird gerundet?`;
    a.opt.forEach(o => { const b = T.knopf(String(o), () => antwortW(o, b), "antwort"); opt.appendChild(b); });
  }
  zeigeZahl(); fortschritt();
  loesKn.hidden = a.art !== "selbst"; loesKn.disabled = false;
  weiterKn.textContent = runde >= RUNDEN ? "Fertig" : "Weiter";
  zeitEl.style.visibility = zeit ? "visible" : "hidden";
  if (zeit) { const b = zeitEl.firstChild; b.getBoundingClientRect(); b.style.transition = `width ${zeit}s linear`; b.style.width = "0%"; uhr = setTimeout(loesung, zeit * 1000); }
}
function antwortW(o, b) {
  if (gezeigt) return;
  if (o === aufg.r) { b.classList.add("richtig"); loesung(T.lob()); T.fertig(rf === 0); }
  else { rf++; b.classList.add("weg"); T.melde(rueck, "noch", "Noch nicht. Schau noch einmal."); }
}
function antwortZH(k, b) {
  if (gezeigt) return;
  if (k === aufg.st) { b.classList.add("richtig"); loesung(T.lob()); T.fertig(rf === 0); }
  else { rf++; b.classList.add("weg"); T.melde(rueck, "noch", "Noch nicht. Schau noch einmal."); }
}
function loesung(lob) {
  if (gezeigt) return; gezeigt = true; stoppeUhr(); zeitEl.style.visibility = "hidden"; loesKn.disabled = true;
  const a = aufg, d = R.pruefziffer(a.n, a.st);
  if (a.art === "waehlen") [...opt.children].forEach(b => { if (+b.textContent === a.r) b.classList.add("richtig"); });
  zeigeZahl();
  if (kleinBerg) {
    bergBox.hidden = false; bergBox.innerHTML = ""; const b = R.berg(bergBox, { breite: 380 }), nb = Math.floor(a.n / R.BASIS[a.st]) * R.BASIS[a.st];
    b.fuesse(nb, nb + R.BASIS[a.st]); b.kugel(d, S.classList.contains("farben") ? R.FARBE[a.st] : "#1d2320", true);
    const seite = d >= 5 ? "o" : "u"; b.rolle(seite); b.fuss(seite);
  }
  const satz = a.art === "zh" ? `Auf ${R.NAME[a.st]} gerundet.` : R.kurzSatz(a.n, a.st);
  T.melde(rueck, lob ? "ok" : "grau", (lob ? lob + " " : "") + satz);
}
function weiter() {
  if (!gezeigt) loesung();
  if (runde >= RUNDEN) {
    runde = RUNDEN + 1; T.melde(rueck, "ok", "Geschafft! Alle 10 Runden sind fertig.");
    weiterKn.disabled = true; loesKn.hidden = true; fort.textContent = "Fertig"; stoppeUhr(); return;
  }
  runde++; aufg = neueAufgabe(); zeigeAufgabe();
}
if (!T.runde({ id: "blitzrunde", neu: n => { stufe = n; zeit = 0; rf = 0; runde = 1; aufg = neueAufgabe(); zeigeAufgabe(); return `rb-${aufg.n}-${aufg.st}`; } })) start();
</script>
</body>
</html>
