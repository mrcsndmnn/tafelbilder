<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blitzrunde Runden – Runden</title>
<link rel="stylesheet" href="../../zahlenraum-1000/gemeinsam/tafel.css">
<link rel="stylesheet" href="../gemeinsam/runden.css">
<link rel="stylesheet" href="../../../gemeinsam/hinweise.css">
<style>
.karte{display:flex;gap:20px;width:900px;height:430px;padding:26px 30px;border:5px solid var(--ink);border-radius:26px;background:#fff;box-shadow:0 6px 0 #c9d1cb}
.karte .links{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.karte .rechts{width:440px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.gross{font-size:140px;font-weight:700;line-height:1.05;white-space:nowrap}
.gross.mittel{font-size:96px}
.gross.mitlupe{padding-top:40px}
.frage{font-size:36px;font-weight:700;margin-top:14px;line-height:1.2}
.ergebnis{font-size:50px;font-weight:700;margin-top:12px;min-height:56px}
.antwort{width:300px;min-height:100px;font-size:56px}
.antwort.weg{opacity:.3}
.antwort.richtig{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.zh{width:170px;min-height:150px;font-size:80px;color:#fff;border-color:var(--ink)}
.zh.z{background:var(--Z)} .zh.h{background:var(--H)}
.zh.z:hover{background:#b83029} .zh.h:hover{background:#26763a}
.zh.richtig{box-shadow:0 0 0 8px var(--gelb)}
.zh.weg{opacity:.3}
.zhreihe{display:flex;gap:24px}
.zeit{width:900px;height:20px;border-radius:10px;background:#e6ebe7;overflow:hidden}
.zeit div{height:100%;width:100%;background:var(--E);border-radius:10px}
.bedien{display:flex;gap:14px;align-items:center;width:900px}
.zaehler{margin-left:auto;font-size:30px;font-weight:700;color:var(--soft)}
.ampel h2{font-size:32px;margin:0 0 6px}
.ampel p{font-size:22px;color:var(--soft);margin:0 0 16px}
.ampel .kn{display:flex;align-items:center;gap:22px;margin-bottom:16px}
.ampel .licht{width:112px;height:112px;border-radius:50%;border:5px solid var(--ink);cursor:pointer;font-family:var(--font);font-size:22px;font-weight:700;touch-action:manipulation}
.ampel .licht:focus-visible{outline:5px solid var(--ok);outline-offset:3px}
.ampel .gruen{background:#3fae5a;color:#fff}.ampel .gelb{background:#f5c518;color:var(--ink)}.ampel .rot{background:#e0564f;color:#fff}
.ampel .anz{font-size:52px;font-weight:700;min-width:90px}
.summe{font-size:24px;border:3px solid var(--ink);border-radius:14px;padding:14px 18px;background:#fff}
.summe .balken{display:flex;height:30px;border-radius:8px;overflow:hidden;margin-top:10px;background:#e6ebe7}
</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<script src="../../../gemeinsam/hinweise.js"></script>
<script>
window.HINWEISE = {
 titel: "Blitzrunde Runden",
 start: "**Start** führt zur Startseite mit allen Tafelbildern zum Runden.",
 farben: "**Farben** hat hier keine eigene Wirkung: Die großen Zahlen sind immer in den Stellenwertfarben.",
 teile: [
  { h: "Worum geht es?", text: "Kurze Wiederholung zum Stundenbeginn (3–5 Minuten), immer im gleichen Ablauf wie die Blitzrunde im Zahlenraum." },
  { h: "Aufgabenarten", punkte: [
    "**Wählen**: „Auf welchen Zehner wird gerundet?“ Eine der Antwortkarten antippen.",
    "**Selbst**: „458 ≈ ?“ Die Klasse sagt die Lösung laut, **Lösung** deckt auf.",
    "**Z oder H?**: „369 ≈ 400“ – wurde auf Zehner oder Hunderter gerundet? Z oder H antippen.",
    "**gemischt**: Auf Stufe ●/●● Wählen und Selbst, auf Stufe ●●● alle drei."]},
  { h: "Ablauf", punkte: [
    "Nach der Lösung zeigt ein kleiner Rundungsberg die Kugel und ein Satz wie „Die Einerziffer ist 4. Ich runde ab.“",
    "**Nächste Runde**. Nach 10 Runden kommt die Zusammenfassung der Klassen-Ampel. **Neu** beginnt von vorn.",
    "**Zeit**: aus, 5 s oder 10 s. Läuft der Balken ab, erscheint die Lösung von selbst.",
    "**Heftzahlen**: Zahlen aus dem Übungsheft (z. B. 273, 456, 250, 499) kommen bevorzugt dran."]},
  { h: "Stufen", punkte: ["**●**: nur Zehner, die Prüfstelle ist schon unterstrichen. **●●**: Zehner und Hunderter, ohne Unterstreichung. **●●●**: mit Sonderfällen (Mitte, Übergang, unter 100, schon rund); bei Wählen gibt es dann drei Karten."]},
  { h: "Klassen-Ampel", punkte: ["Für jedes Kind einmal Gut, Geht so oder Schwer antippen (Daumen hoch, Mitte, runter). Es wird nichts gespeichert."]}]
};
</script>
<script src="../../zahlenraum-1000/gemeinsam/tafel.js"></script>
<script src="../gemeinsam/runden.js"></script>
<script>
const T = Tafel, R = Runden, S = T.buehne();
const RUNDEN = 10;
const HEFTZAHLEN = [273, 456, 250, 499, 875, 922, 505, 750, 138, 255, 359, 229, 351, 258, 349, 275, 396, 47, 55, 950, 754, 458, 369];
let stufe = 1, art = "waehlen", zeit = 0, heft = T.laden("rblitz-heft", false), runde = 1, aufg = null, gezeigt = false, uhr = null, letzte = 0;
const ampel = { gruen: 0, gelb: 0, rot: 0 };

// ---------- Aufbau ----------
const stufenWahl = T.stufen(v => { stufe = v; start(); }, "rblitz-stufe");
const artWahl = T.gruppe("Art", [{ wert: "waehlen", text: "Wählen" }, { wert: "selbst", text: "Selbst" }, { wert: "zh", text: "Z oder H?" }, { wert: "mix", text: "gemischt" }], "waehlen",
  v => { art = v; start(); }, "rblitz-art");
const zeitWahl = T.gruppe("Zeit", [{ wert: 0, text: "aus" }, { wert: 5, text: "5 s" }, { wert: 10, text: "10 s" }], 0, v => { zeit = v; zeigeAufgabe(); }, "rblitz-zeit");
stufe = stufenWahl.wert; art = artWahl.wert; zeit = zeitWahl.wert;
T.leiste(stufenWahl, artWahl, zeitWahl);

const kBox = T.blk(50, 182); const karte = T.el("div", "karte"); kBox.appendChild(karte);
const links = T.el("div", "links"), rechts = T.el("div", "rechts"); karte.append(links, rechts);
const zeitBox = T.blk(50, 630); const zeitEl = T.el("div", "zeit", "<div></div>"); zeitBox.appendChild(zeitEl);
const bed = T.blk(50, 664); const bedien = T.el("div", "bedien"); bed.appendChild(bedien);
const loesKn = T.knopf("Lösung", () => loesung(), "haupt"), weiterKn = T.knopf("Nächste Runde", () => weiter());
const heftKn = T.schalter("Heftzahlen", heft, v => { heft = v; T.merken("rblitz-heft", v); });
const zaehler = T.el("span", "zaehler"); bedien.append(loesKn, weiterKn, heftKn, zaehler);
const satz = T.streifen(T.blk(50, 750, 900), "hilfe");

const ab = T.blk(1000, 182, 560); ab.classList.add("ampel");
ab.innerHTML = "<h2>Klassen-Ampel</h2><p>Daumen hoch, Mitte oder runter? Tippe für jedes Kind.</p>";
const anz = {};
[["gruen", "Gut"], ["gelb", "Geht so"], ["rot", "Schwer"]].forEach(([k, t]) => {
  const z = T.el("div", "kn"); const b = T.el("button", "licht " + k, t); b.type = "button"; const a = T.el("span", "anz", "0"); anz[k] = a;
  b.addEventListener("click", () => { ampel[k]++; a.textContent = ampel[k]; if (runde > RUNDEN) zeigeSumme(); });
  z.append(b, a); ab.appendChild(z);
});
const summe = T.el("div", "summe"); summe.hidden = true; ab.appendChild(summe);
T.kopf({ titel: "Blitzrunde Runden", onNeu: () => start() });

// ---------- Aufgaben ----------
function zahl(st) {
  if (heft && Math.random() < .7) { const l = HEFTZAHLEN.filter(x => x !== letzte && (st === "Z" || x >= 11)); return T.wahl(l); }
  return R.zufallsZahl(st, stufe, letzte);
}
function neueAufgabe() {
  let a = art === "mix" ? T.wahl(stufe === 3 ? ["waehlen", "selbst", "zh"] : ["waehlen", "selbst"]) : art;
  for (let v = 0; v < 300; v++) {
    const st = stufe === 1 && a !== "zh" ? "Z" : T.wahl(["Z", "H"]);
    const n = zahl(st), r = R.runde(n, st);
    if (a === "zh" && (R.runde(n, "Z") === R.runde(n, "H") || n % 10 === 0)) continue;
    if (n === letzte) continue;
    const x = { art: a, st, n, r };
    if (a === "waehlen") {
      const nb = R.nachbarn(n, st), b = R.BASIS[st];
      let opt = nb.rund ? [n, n + b] : [nb.u, nb.o];
      if (stufe === 3) { const abl = T.wahl([nb.u - b, nb.o + b, R.runde(n, R.ANDERE[st])].filter(z => z >= 0 && z <= 1000 && !opt.includes(z))); if (abl != null) opt.push(abl); }
      x.opt = opt.sort((p, q) => p - q);
    }
    letzte = n; return x;
  }
}

// ---------- Ablauf ----------
function stoppeUhr() { clearTimeout(uhr); uhr = null; const b = zeitEl.firstChild; b.style.transition = "none"; b.style.width = "100%"; }
addEventListener("pagehide", stoppeUhr);
function start() {
  runde = 1; Object.keys(ampel).forEach(k => { ampel[k] = 0; anz[k].textContent = "0"; }); summe.hidden = true; weiterKn.disabled = false;
  aufg = neueAufgabe(); zeigeAufgabe();
}
function zeigeAufgabe() {
  stoppeUhr(); gezeigt = false; const a = aufg, lupe = stufe === 1 ? a.st : null;
  links.innerHTML = ""; rechts.innerHTML = ""; T.melde(satz, "", "");
  rechts.style.display = a.art === "selbst" ? "none" : "";
  if (a.art === "zh") {
    links.append(T.el("div", "gross mittel zahl", R.gleichung(a.n, a.r)), T.el("div", "frage", "Auf Zehner oder Hunderter gerundet?"));
    const reihe = T.el("div", "zhreihe"); rechts.appendChild(reihe);
    ["Z", "H"].forEach(k => { const b = T.knopf(k, () => antwortZH(k, b), "zh " + k.toLowerCase()); b.setAttribute("aria-label", R.NAME[k]); reihe.appendChild(b); });
  } else if (a.art === "selbst") {
    links.append(T.el("div", "gross zahl" + (lupe ? " mitlupe" : ""), `${R.zahl(a.n, lupe)}<span class="ca">≈</span>?`), T.el("div", "frage", `Runde auf ${R.NAME[a.st]}.`));
  } else {
    links.append(T.el("div", "gross zahl" + (lupe ? " mitlupe" : ""), R.zahl(a.n, lupe)), T.el("div", "frage", `Auf welchen ${R.NAME[a.st]} wird gerundet?`));
    a.opt.forEach(o => { const b = T.knopf(String(o), () => antwortW(o, b), "antwort"); rechts.appendChild(b); });
  }
  links.appendChild(T.el("div", "ergebnis zahl"));
  zaehler.textContent = `Runde ${Math.min(runde, RUNDEN)} von ${RUNDEN}`;
  loesKn.disabled = false; weiterKn.textContent = runde >= RUNDEN ? "Runde beenden" : "Nächste Runde";
  zeitBox.style.visibility = zeit ? "visible" : "hidden";
  if (zeit) { const b = zeitEl.firstChild; b.getBoundingClientRect(); b.style.transition = `width ${zeit}s linear`; b.style.width = "0%"; uhr = setTimeout(loesung, zeit * 1000); }
}
function antwortW(o, b) {
  if (gezeigt) return;
  if (o === aufg.r) { b.classList.add("richtig"); loesung(T.lob()); }
  else { b.classList.add("weg"); T.melde(satz, "noch", T.NOCH); }
}
function antwortZH(k, b) {
  if (gezeigt) return;
  if (k === aufg.st) { b.classList.add("richtig"); loesung(T.lob()); }
  else { b.classList.add("weg"); T.melde(satz, "noch", T.NOCH); }
}
function loesung(lob) {
  if (gezeigt) return; gezeigt = true; clearTimeout(uhr); loesKn.disabled = true;
  const a = aufg, d = R.pruefziffer(a.n, a.st);
  rechts.style.display = "";
  if (a.art === "selbst") links.querySelector(".gross").innerHTML = R.zahl(a.n, stufe === 1 ? a.st : null);
  if (a.art !== "zh") links.querySelector(".ergebnis").innerHTML = R.gleichung(a.n, a.r);
  else { const e = links.querySelector(".ergebnis"); e.style.fontSize = "34px"; e.textContent = `Auf ${R.NAME[a.st]} gerundet.`; }
  // kleiner Rundungsberg mit der Lösung
  rechts.innerHTML = ""; const b = R.berg(rechts, { breite: 440 }), nb = Math.floor(a.n / R.BASIS[a.st]) * R.BASIS[a.st];
  b.fuesse(nb, nb + R.BASIS[a.st]); b.kugel(d, R.FARBE[a.st], true); const seite = d >= 5 ? "o" : "u"; b.rolle(seite); b.fuss(seite);
  const t = [];
  if (lob) t.push(lob);
  if (a.art === "zh") t.push(`Es wurde auf ${R.NAME[a.st]} gerundet. Ich schaue auf die ${R.PRUEFNAME[a.st]}.`);
  t.push(R.kurzSatz(a.n, a.st), ...R.zusatz(a.n, a.st));
  T.melde(satz, lob ? "ok" : "", t);
}
function weiter() {
  if (!gezeigt) loesung();
  if (runde >= RUNDEN) { runde = RUNDEN + 1; zeigeSumme(); weiterKn.disabled = true; loesKn.disabled = true; zaehler.textContent = "Fertig!"; stoppeUhr(); return; }
  runde++; aufg = neueAufgabe(); zeigeAufgabe();
}
function zeigeSumme() {
  const g = ampel.gruen + ampel.gelb + ampel.rot; summe.hidden = false;
  summe.innerHTML = `<strong>Runde fertig!</strong><br>Gut: ${ampel.gruen} · Geht so: ${ampel.gelb} · Schwer: ${ampel.rot}` +
    (g ? `<div class="balken"><div style="width:${ampel.gruen / g * 100}%;background:#3fae5a"></div><div style="width:${ampel.gelb / g * 100}%;background:#f5c518"></div><div style="width:${ampel.rot / g * 100}%;background:#e0564f"></div></div>` : "");
}
start();
</script>
</body>
</html>
