<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Suchmaschinen sollen diese Seite nicht aufnehmen -->
<meta name="robots" content="noindex, nofollow">
<title>Der Rundungsberg – Runden</title>
<link rel="stylesheet" href="../../zahlenraum-1000/gemeinsam/tafel.css?v=2026112802">
<link rel="stylesheet" href="../gemeinsam/runden.css?v=2026112802">
<link rel="stylesheet" href="../../../gemeinsam/lehrkraftmenue.css?v=2026112802">
<style>
.zahl-oben{position:absolute;left:0;width:1600px;top:96px;text-align:center}
.zahl-oben .gleichung{font-size:96px}
.bergplatz{position:absolute;left:350px;top:222px}
.hilfe-links{position:absolute;left:40px;top:250px;width:300px}
.hilfe-links .swt{transform:scale(.8);transform-origin:left top}
</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<script>
window.HINWEISE = {
 titel: "Der Rundungsberg",
 teile: [
  { h: "Worum geht es?", text: "Die Regel 0–4 abrunden, 5–9 aufrunden wird als Kugel auf einem Berg sichtbar. Die Kinder sprechen vier feste Denkschritte." },
  { h: "Zeigen (Lehrkraft führt)", punkte: [
    "**Weiter** (unten rechts) geht die vier Schritte durch. Es steht immer nur der aktuelle Satz da: 1. „Ich runde auf Zehner.“ 2. „Ich schaue auf die Einer.“ (Ziffer wird unterstrichen) 3. „Die Einerziffer ist 3.“ (Kugel auf den Berg) 4. „Ich runde ab.“ (Kugel rollt).",
    "Danach steht oben die Gleichung, z. B. 273 ≈ 270. **Weiter** startet eine neue Zahl." ] },
  { h: "Ich bin dran", punkte: ["Die Kinder tippen den Platz der Ziffer auf dem Berg an, dann den Fuß, zu dem die Kugel rollt."] },
  { h: "Im Lehrkraftmenü", punkte: [
    "**Modus**, **Runden auf**, **Stufe** und **Eigene Zahl**.",
    "Hilfen: **ab/auf zeigen** (graue Wörter am Berg), **Merkkarte**, **Stellenwerttafel**. **Farben** färbt Ziffern und Kugel nach Stellenwert." ] } ]
};
</script>
<script src="../../../gemeinsam/uebungsrunde/runde-client.js?v=2026112802"></script>
<script src="../../zahlenraum-1000/gemeinsam/tafel.js?v=2026112802"></script>
<script src="../../../gemeinsam/lehrkraftmenue.js?v=2026112802"></script>
<script src="../gemeinsam/runden.js?v=2026112802"></script>
<script>
const T = Tafel, R = Runden, S = T.buehne();
let rf = 0, modus = "zeigen", st = "Z", stufe = 1, n = 273, schritt = 0, phase = "platz";

// ---------- Kinderansicht ----------
const auftrag = T.blk(60, 34, 1300, 0, "auftrag-zeile");
const oben = T.blk(0, 96, 1600, 0, "zahl-oben");
const bergBox = T.blk(350, 222, 0, 0, "bergplatz");
const berg = R.berg(bergBox, { breite: 900, onPlatz: i => platz(i), onFuss: f => fuss(f) });
const rueck = T.blk(100, 700, 1400, 0, "rueck");
const links = T.blk(40, 250, 300, 0, "hilfe-links");
const swtBox = T.el("div"); links.appendChild(swtBox); const swt = T.stellenwerttafel(swtBox); swtBox.hidden = true;
const merk = T.el("div", "merkkarte", R.MERK); merk.hidden = true; merk.style.marginTop = "20px"; links.appendChild(merk);
const weiterKn = T.knopf("Weiter", () => weiter(), "haupt"); weiterKn.dataset.runde = "aus";
T.kinderknoepfe(weiterKn);

// ---------- Lehrkraftmenü ----------
const modusWahl = T.gruppe("Modus", [{ wert: "zeigen", text: "Zeigen" }, { wert: "dran", text: "Ich bin dran" }], "zeigen", v => { modus = v; neu(n); }, "berg-modus");
const stWahl = T.gruppe("Runden auf", [{ wert: "Z", text: "Zehner" }, { wert: "H", text: "Hunderter" }], "Z", v => { st = v; neu(); }, "berg-st");
const stufenWahl = T.gruppe("Stufe", [{ wert: 1, text: "1" }, { wert: 2, text: "2" }, { wert: 3, text: "3 Sonderfälle" }], 1, v => { stufe = v; neu(); }, "berg-stufe");
modus = modusWahl.wert; st = stWahl.wert; stufe = stufenWahl.wert;
const ein = T.el("div", "eingabe", '<label for="zahl">Eigene Zahl</label><input id="zahl" type="text" inputmode="numeric" maxlength="3" autocomplete="off">');
const uebernehmen = T.knopf("Übernehmen", () => { const v = parseInt(ein.querySelector("input").value, 10); if (v >= 1 && v <= 999) neu(v); });
ein.appendChild(uebernehmen); ein.querySelector("input").addEventListener("keydown", e => { if (e.key === "Enter") uebernehmen.click(); });
const abaufKn = T.schalter("ab/auf zeigen", false, v => S.classList.toggle("abauf", v));
const merkKn = T.schalter("Merkkarte", false, v => { merk.hidden = !v; });
const swtKn = T.schalter("Stellenwerttafel", false, v => { swtBox.hidden = !v; });
T.kopf({ menue: true, titel: "Der Rundungsberg", beschreibung: "Die Kugel zeigt: abrunden oder aufrunden?",
  satzmuster: false, onNeu: () => neu(), onLoesung: () => loesung(), extra: [modusWahl, stWahl, stufenWahl, ein], hilfen: [abaufKn, merkKn, swtKn],
  onFarben: () => { if (berg.el.querySelector(".kugel").style.visibility === "visible") berg.el.querySelector(".kugel circle").setAttribute("fill", farbe()); } });

// ---------- Anzeige ----------
const farbe = () => S.classList.contains("farben") ? R.FARBE[st] : "#1d2320";
function zeigeZahl(mitPruef) { oben.innerHTML = `<span class="zahl gross96">${R.zahl(n, mitPruef ? st : null)}</span>`; }
function tafel(markierung) {
  swt.zeige(n); const t = swtBox.querySelector("table");
  if (markierung >= 1) t.querySelector("th." + st.toLowerCase()).classList.add("leucht");
  if (markierung >= 2) { const td = t.querySelector("td." + R.PRUEF[st].toLowerCase()); td.innerHTML = `<span class="pruef">${td.textContent}</span>`; }
}
const fuesse = () => { const b = R.BASIS[st], u = Math.floor(n / b) * b; return { u, o: u + b }; };

// ---------- Ablauf ----------
function neu(zahl) {
  T.stop();
  if (stufe === 1 && st !== "Z") { st = "Z"; stWahl.setze("Z"); }
  if (stufe === 3 && !zahl) { st = T.wahl(["Z", "H"]); stWahl.setze(st); }
  n = zahl || R.zufallsZahl(st, stufe, n);
  const f = fuesse(); berg.leere(); berg.fuesse(f.u, f.o); berg.tippbar(modus === "dran");
  weiterKn.textContent = "Weiter";
  if (modus === "zeigen") {
    schritt = 0; phase = "platz"; zeigeZahl(false); tafel(0);
    auftrag.textContent = "Wir runden zusammen."; T.melde(rueck, "grau", "");
    weiterKn.hidden = false;
  } else {
    schritt = 3; phase = "platz"; zeigeZahl(true); tafel(2);
    auftrag.textContent = "Wo liegt die Kugel? Tippe den Platz an.";
    T.melde(rueck, "", ""); weiterKn.hidden = true;
  }
}
async function weiter() {
  if (modus !== "zeigen") return neu();
  if (phase === "fertig") return neu();
  if (phase === "rollt") return;
  schritt++; const d = R.pruefziffer(n, st), ds = R.denkschritte(n, st);
  tafel(Math.min(schritt, 2)); if (schritt >= 2) zeigeZahl(true);
  T.melde(rueck, "", ds[schritt - 1]);   // immer nur der aktuelle Satz
  if (schritt === 3) berg.kugel(d, farbe());
  if (schritt === 4) { phase = "rollt"; berg.kugel(d, farbe(), true); await rollen(d); phase = "fertig"; weiterKn.textContent = "Neue Zahl"; }
}
async function rollen(d) {
  const lauf = T.lauf, seite = d >= 5 ? "o" : "u";
  berg.rolle(seite); await T.warte(700); if (lauf !== T.lauf) return;
  berg.fuss(seite);
  oben.innerHTML = `<span class="gleichung zahl einblenden">${R.gleichung(n, R.runde(n, st))}</span>`;
  auftrag.textContent = "";
}
function loesung() {
  if (phase === "fertig" || phase === "rollt") return;
  T.stop(); const d = R.pruefziffer(n, st); zeigeZahl(true); tafel(2);
  berg.kugel(d, farbe(), true); phase = "rollt";
  rollen(d).then(() => { phase = "fertig"; T.melde(rueck, "grau", R.kurzSatz(n, st)); if (modus === "zeigen") weiterKn.textContent = "Neue Zahl"; });
}
function platz(i) {
  if (modus !== "dran" || phase !== "platz") return;
  const d = R.pruefziffer(n, st);
  if (i !== d) { rf++; berg.platz(i, "falsch"); return T.melde(rueck, "noch", `Noch nicht. Schau auf die ${R.PRUEFNAME[st]}ziffer.`); }
  berg.platz(i); berg.kugel(d, farbe()); phase = "fuss";
  auftrag.textContent = "Wohin rollt die Kugel? Tippe den Fuß an.";
  T.melde(rueck, "ok", `${T.lob()} Die ${R.PRUEFNAME[st]}ziffer ist ${d}.`);
}
async function fuss(f) {
  if (modus !== "dran" || phase !== "fuss") return;
  const d = R.pruefziffer(n, st), richtig = d >= 5 ? "o" : "u";
  if (f !== richtig) return rf++, T.melde(rueck, "noch", `Noch nicht. ${d} – abrunden oder aufrunden?`);
  phase = "rollt"; await rollen(d); phase = "fertig";
  T.melde(rueck, "ok", `${T.lob()} ${R.denkschritte(n, st)[3]}`);
  T.fertig(rf === 0);
}
// Übungsrunde: „Ich bin dran“; Hilfe = Merkkarte
if (!T.runde({ id: "rundungsberg", neu: s => { stufe = s; modus = "dran"; rf = 0; neu(); return `berg-${n}-${st}`; }, hilfe: an => { merk.hidden = !an; } })) neu(273);
</script>
</body>
</html>
