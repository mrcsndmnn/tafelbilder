<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Suchmaschinen sollen diese Seite nicht aufnehmen -->
<meta name="robots" content="noindex, nofollow">
<title>Genau oder gerundet? Das Schulfest – Runden</title>
<link rel="stylesheet" href="../../zahlenraum-1000/gemeinsam/tafel.css?v=2026112802">
<link rel="stylesheet" href="../gemeinsam/runden.css?v=2026112802">
<link rel="stylesheet" href="../../../gemeinsam/lehrkraftmenue.css?v=2026112802">
<style>
.karte-mitte{position:absolute;left:400px;width:800px;top:120px;min-height:200px;display:flex;align-items:center;gap:34px;padding:26px 40px;
  border:3px solid var(--ink);border-radius:22px;background:#fff;cursor:grab;touch-action:none;user-select:none}
.karte-mitte.gewaehlt{outline:5px solid var(--ink);outline-offset:6px}
.karte-mitte svg,.mini svg{flex:none;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.karte-mitte .txt{font-size:46px;font-weight:700;line-height:1.25}
.karte-mitte.ziehen{position:fixed;z-index:100;pointer-events:none;opacity:.9}
.leer-info{position:absolute;left:0;width:1600px;top:190px;text-align:center;font-size:40px;font-weight:700}
.koerbe{position:absolute;left:180px;width:1240px;top:370px;display:flex;gap:40px}
.korb{flex:1;height:250px;border:3px solid var(--ink);border-radius:22px;background:#fff;padding:16px 22px;cursor:pointer;display:flex;flex-direction:column}
.korb.ziel{background:#f3f5f4;border-width:5px}
.korb h3{margin:0 0 10px;font-size:38px;display:flex;align-items:center;gap:16px}
.korb h3 .z{font-size:52px;line-height:1}
.korb .inhalt{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.mini{display:flex;align-items:center;gap:10px;font-size:21px;color:#4d5752}
.mini svg{width:26px;height:26px;stroke-width:4}
.mini .flagge{margin-left:auto;font-size:17px;color:#6d7772;white-space:nowrap}
.mini .flagge.anders{color:var(--noch);font-weight:700}
.satz-mitte{position:absolute;left:120px;right:120px;top:170px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
.satz-mitte .wort{font:inherit;font-size:60px;font-weight:700;background:none;border:none;padding:4px 6px;border-radius:10px;cursor:pointer;color:var(--ink)}
.satz-mitte .wort:hover{background:#f3f5f4}
.satz-mitte .wort.leucht{text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.16em}
.satz-mitte .wort.nichts{color:#9aa39e}
.wahl-mitte{position:absolute;left:0;width:1600px;top:420px;display:flex;justify-content:center;gap:40px}
.wahl-mitte .knopf{min-width:300px;min-height:110px;font-size:46px;border-width:3px;background:#fff}
.wahl-mitte .knopf.richtig{border-color:var(--ok);border-width:7px}
.wahl-mitte .knopf.weg{opacity:.3}
</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<script>
window.HINWEISE = {
 titel: "Genau oder gerundet? Das Schulfest",
 teile: [
  { h: "Worum geht es?", text: "Nicht jede Zahl darf man runden. Die Kinder entscheiden an Alltagssätzen: Reicht ungefähr, oder muss die Zahl genau sein?" },
  { h: "Sortieren", punkte: [
    "In der Mitte liegt immer eine Karte. Die Kinder ziehen sie in einen Korb – oder tippen erst die Karte und dann den Korb an.",
    "Unter den Körben steht eine Begründung. Manche Karten sind bewusst diskutierbar (z. B. Becher, Bus): Beide Körbe können stimmen.",
    "Im Korb „darf ich runden“ zeigt ein Tipp auf die kleine Karte die gerundete Zahl." ] },
  { h: "Gerundet oder nicht?", punkte: [
    "Ein Satz steht groß in der Mitte. Die Kinder suchen ein Wort, das verrät: Die Zahl ist gerundet (fast, etwa, ca., ungefähr). Gefundene Wörter werden unterstrichen.",
    "Dann entscheiden sie: **gerundet ≈** oder **genau =**. **Weiter** zeigt den nächsten Satz." ] },
  { h: "Im Lehrkraftmenü", punkte: [
    "**Modus**, **Set** (Schulfest, Alltag), **Stufe** (1: nur eindeutige Karten).",
    "**Vorlesen** liest die Karte oder den Satz vor (wenn das Gerät eine Sprachausgabe hat).",
    "Hilfe **Vergleichen** zeigt im Korb den Lösungsvorschlag. **Signalwörter** blendet die vier Wörter ein." ] } ]
};
</script>
<script src="../../../gemeinsam/uebungsrunde/runde-client.js?v=2026112802"></script>
<script src="../../zahlenraum-1000/gemeinsam/tafel.js?v=2026112802"></script>
<script src="../../../gemeinsam/lehrkraftmenue.js?v=2026112802"></script>
<script src="../gemeinsam/runden.js?v=2026112802"></script>
<script src="karten.js"></script>
<script>
const T = Tafel, R = Runden, S = T.buehne();
const KORB = { r: { titel: "darf ich runden", z: "≈" }, g: { titel: "muss genau sein", z: "=" } };
// schlichte Liniensymbole (selbst gezeichnet, 64 × 64)
const ICON = {
  gaeste: '<circle cx="22" cy="20" r="8"/><path d="M8 50c0-10 6-17 14-17s14 7 14 17"/><circle cx="44" cy="22" r="7"/><path d="M36 37c2-2 5-3 8-3 8 0 13 7 13 16"/>',
  becher: '<path d="M16 14h32l-5 40H21z"/><path d="M18 26h28"/>',
  los: '<path d="M8 18h48v8a6 6 0 0 0 0 12v8H8v-8a6 6 0 0 0 0-12z"/><path d="M24 18v28" stroke-dasharray="4 4"/>',
  weg: '<path d="M10 54c10-6 4-14 14-18s16-4 14-14"/><path d="M42 8v20"/><path d="M42 8l12 5-12 5"/>',
  bus: '<rect x="8" y="12" width="48" height="34" rx="6"/><path d="M8 30h48M22 12v18M36 12v18"/><circle cx="20" cy="50" r="5"/><circle cx="44" cy="50" r="5"/>',
  ballons: '<ellipse cx="32" cy="22" rx="13" ry="16"/><path d="M32 38l-3 4h6zM32 42c-4 6 4 10 0 16"/>',
  beginn: '<circle cx="32" cy="32" r="22"/><path d="M32 18v14l10 6"/>',
  kuchen: '<path d="M10 46l40-22v22z"/><path d="M10 46h40"/><path d="M30 35l20-11"/>',
  auto: '<path d="M8 40v-8l8-12h28l10 12v8z"/><path d="M18 20l-4 12M42 20l6 12"/><circle cx="20" cy="44" r="5"/><circle cx="46" cy="44" r="5"/>',
  turm: '<path d="M22 58V26l10-18 10 18v32z"/><path d="M22 26h20"/><path d="M28 58V46a4 4 0 0 1 8 0v12"/>',
  loewe: '<circle cx="32" cy="32" r="22"/><circle cx="32" cy="34" r="12"/><circle cx="28" cy="31" r="1.5"/><circle cx="36" cy="31" r="1.5"/><path d="M29 38q3 3 6 0"/>',
  telefon: '<rect x="20" y="8" width="24" height="48" rx="5"/><path d="M28 48h8"/>',
  pin: '<circle cx="18" cy="16" r="3"/><circle cx="32" cy="16" r="3"/><circle cx="46" cy="16" r="3"/><circle cx="18" cy="30" r="3"/><circle cx="32" cy="30" r="3"/><circle cx="46" cy="30" r="3"/><circle cx="18" cy="44" r="3"/><circle cx="32" cy="44" r="3"/><circle cx="46" cy="44" r="3"/>',
  geburt: '<rect x="12" y="32" width="40" height="22" rx="3"/><path d="M12 42h40"/><path d="M32 32V20"/><path d="M32 12q4 4 0 8q-4-4 0-8"/>',
  kiga: '<circle cx="32" cy="16" r="8"/><path d="M20 56V38a12 12 0 0 1 24 0v18"/><path d="M32 40v16"/>',
};
const icon = (id, gr) => `<svg viewBox="0 0 64 64" width="${gr}" height="${gr}" aria-hidden="true">${ICON[id] || '<circle cx="32" cy="32" r="20"/>'}</svg>`;
let modus = "sortieren", set = "schulfest", stufe = 1, stapel = [], lage = {}, rund = new Set(), gewaehlt = null, vergleichen = false, rf = 0;
const sprache = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";

// ---------- Kinderansicht ----------
const auftrag = T.blk(60, 34, 1300, 0, "auftrag-zeile");
const karteBox = T.blk(0, 0, 1600, 0);
const koerbe = T.blk(180, 370, 1240, 0, "koerbe");
const rueck = T.blk(100, 660, 1400, 0, "rueck");
const signal = T.blk(0, 0, 1600, 0); signal.hidden = true;
const weiterKn = T.knopf("Weiter", () => neuerSatz(), "haupt"); weiterKn.dataset.runde = "aus";
T.kinderknoepfe(weiterKn);

// ---------- Lehrkraftmenü ----------
const modusWahl = T.gruppe("Modus", [{ wert: "sortieren", text: "Sortieren" }, { wert: "signal", text: "Gerundet oder nicht?" }], "sortieren", v => { modus = v; neu(); });
const setWahl = T.gruppe("Set", SETS, "schulfest", v => { set = v; neu(); }, "fest-set");
const stufenWahl = T.gruppe("Stufe", [{ wert: 1, text: "1 eindeutig" }, { wert: 2, text: "2 alle Karten" }], 1, v => { stufe = v; neu(); }, "fest-stufe2");
set = setWahl.wert; stufe = stufenWahl.wert;
const vglKn = T.schalter("Vergleichen (Vorschlag zeigen)", false, v => { vergleichen = v; zeichneKoerbe(); });
const sigKn = T.schalter("Signalwörter zeigen", false, v => { sigHilfe = v; if (modus === "signal") T.melde(rueck, "grau", v ? "fast · etwa · ca. · ungefähr" : ""); });
let sigHilfe = false;
T.kopf({ menue: true, titel: "Genau oder gerundet?", beschreibung: "Schulfest: Darf ich die Zahl runden?", farben: false, satzmuster: false,
  onNeu: () => neu(), extra: [modusWahl, setWahl, stufenWahl], hilfen: [vglKn, sigKn] });
if (sprache) T.menue.steuer("Vorlesen", () => vorlesen(modus === "signal" ? SAETZE[satzNr] : (stapel.length ? karte(stapel[0]).text : "")));

// ---------- Sortieren ----------
const alleKarten = () => KARTEN.schulfest.concat(KARTEN.alltag);
const karte = id => alleKarten().find(k => k.id === id);
function neu() {
  T.stop(); rf = 0;
  const sortieren = modus === "sortieren";
  [karteBox, koerbe].forEach(e => e.hidden = !sortieren); signal.hidden = sortieren; weiterKn.hidden = sortieren;
  if (!sortieren) return neuerSatz();
  auftrag.textContent = "Schulfest: Darf ich die Zahl runden?";
  stapel = stufe === 1 ? T.mischen(alleKarten().filter(k => k.leicht).map(k => k.id)) : T.mischen(KARTEN[set].map(k => k.id));
  lage = {}; rund = new Set(); gewaehlt = null;
  zeichneStapel(); zeichneKoerbe(); T.melde(rueck, "", "");
}
function zeichneStapel() {
  karteBox.innerHTML = "";
  if (!stapel.length) { karteBox.appendChild(T.el("div", "leer-info", "Alle Karten sind sortiert.")); return; }
  const k = karte(stapel[0]);
  const el = T.el("div", "karte-mitte" + (gewaehlt === k.id ? " gewaehlt" : ""), `${icon(k.id, 110)}<span class="txt">${k.text}</span>`);
  el.setAttribute("role", "button"); el.setAttribute("aria-label", k.text); el.tabIndex = 0;
  ziehbar(el, k.id); karteBox.appendChild(el);
}
function zeichneKoerbe() {
  koerbe.innerHTML = "";
  ["r", "g"].forEach(id => {
    const k = T.el("div", "korb"); k.dataset.korb = id; k.setAttribute("role", "button"); k.tabIndex = 0; k.setAttribute("aria-label", KORB[id].titel);
    k.innerHTML = `<h3><span class="z">${KORB[id].z}</span>${KORB[id].titel}</h3>`;
    const inh = T.el("div", "inhalt"); k.appendChild(inh);
    Object.entries(lage).filter(([, b]) => b === id).forEach(([kid]) => {
      const c = karte(kid), gerundet = id === "r" && rund.has(kid) && c.gerundet;
      const m = T.el("div", "mini", `${icon(kid, 26)}<span>${gerundet ? c.gerundet : c.text}</span>`);
      if (vergleichen) { const anders = c.vorschlag !== id; m.insertAdjacentHTML("beforeend", `<span class="flagge${anders ? " anders" : ""}">Vorschlag ${c.vorschlag === "r" ? "≈" : "="}${c.reden ? " · reden" : ""}</span>`); }
      m.addEventListener("click", e => { e.stopPropagation(); if (id === "r" && c.gerundet) { rund.has(kid) ? rund.delete(kid) : rund.add(kid); zeichneKoerbe(); } });
      inh.appendChild(m);
    });
    const leg = () => { if (stapel.length) lege(stapel[0], id); };
    k.addEventListener("click", leg);
    k.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); leg(); } });
    koerbe.appendChild(k);
  });
}
function begruendung(c, korb) {
  const weil = korb === "r" ? c.weilR : c.weilG;
  if (!weil) return `Stimmt das? ${c.wer} ${korb === "r" ? "darf ich runden" : "muss genau sein"}, weil …`;
  return `${c.wer} ${korb === "r" ? "darf ich runden" : "muss genau sein"}, weil ${weil}.`;
}
function lege(id, korb) {
  lage[id] = korb; stapel = stapel.filter(x => x !== id); gewaehlt = null; rund.delete(id);
  zeichneStapel(); zeichneKoerbe();
  const c = karte(id);
  T.melde(rueck, c.reden || c.vorschlag === korb ? "" : "grau", begruendung(c, korb) + (stapel.length ? "" : " Alle Karten sind sortiert."));
}
function ziehbar(el, id) {
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    const start = { x: e.clientX, y: e.clientY }, r = el.getBoundingClientRect(); let geist = null;
    const k = S.getBoundingClientRect().width / 1600;
    const bewege = ev => {
      if (!geist && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 10) return;
      if (!geist) { geist = el.cloneNode(true); geist.classList.add("ziehen"); geist.style.width = r.width / k + "px"; geist.style.transformOrigin = "0 0"; geist.style.transform = `scale(${k})`; document.body.appendChild(geist); el.style.opacity = ".35"; }
      geist.style.left = ev.clientX - (start.x - r.left) + "px"; geist.style.top = ev.clientY - (start.y - r.top) + "px";
      const z = korbUnter(ev.clientX, ev.clientY); document.querySelectorAll(".korb").forEach(c => c.classList.toggle("ziel", c === z));
    };
    const ende = ev => {
      removeEventListener("pointermove", bewege); removeEventListener("pointerup", ende); removeEventListener("pointercancel", ende);
      document.querySelectorAll(".korb").forEach(c => c.classList.remove("ziel"));
      if (!geist) { gewaehlt = gewaehlt === id ? null : id; zeichneStapel(); return; }
      geist.remove(); el.style.opacity = "";
      const z = korbUnter(ev.clientX, ev.clientY); if (z) lege(id, z.dataset.korb);
    };
    addEventListener("pointermove", bewege); addEventListener("pointerup", ende); addEventListener("pointercancel", ende);
  });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); gewaehlt = id; zeichneStapel(); } });
}
function korbUnter(x, y) { return [...document.querySelectorAll(".korb")].find(c => { const r = c.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; }) || null; }
function vorlesen(text) {
  if (!sprache || !text) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "de-DE"; u.rate = .9; speechSynthesis.speak(u);
}
addEventListener("pagehide", () => { if (sprache) speechSynthesis.cancel(); });

// ---------- Gerundet oder nicht? ----------
let satzNr = -1, entschieden = false;
const istSignal = w => SIGNALWOERTER.includes(w.toLowerCase().replace(/[,!?]$/, "")) || SIGNALWOERTER.includes(w.toLowerCase().replace(/\.$/, ""));
function neuerSatz() {
  if (modus !== "signal") return;
  satzNr = (satzNr + 1 + T.zufall(0, SAETZE.length - 2)) % SAETZE.length; entschieden = false;
  auftrag.textContent = "Ist die Zahl gerundet?";
  signal.innerHTML = "";
  const s = T.el("div", "satz-mitte"); signal.appendChild(s);
  SAETZE[satzNr].split(" ").forEach(w => {
    const b = T.el("button", "wort", w); b.type = "button";
    b.addEventListener("click", () => {
      if (istSignal(w)) { b.classList.add("leucht"); T.melde(rueck, "ok", `${T.lob()} „${w.replace(/[,!?]$/, "")}“ verrät: Die Zahl ist gerundet.`); }
      else { b.classList.add("nichts"); T.melde(rueck, "grau", "Dieses Wort verrät nichts."); }
    });
    s.appendChild(b);
  });
  const reihe = T.el("div", "wahl-mitte"); signal.appendChild(reihe);
  const kg = T.knopf("gerundet ≈", () => entscheide(true, kg)), kn = T.knopf("genau =", () => entscheide(false, kn));
  reihe.append(kg, kn);
  T.melde(rueck, "grau", sigHilfe ? "fast · etwa · ca. · ungefähr" : "");
}
function entscheide(gerundet, b) {
  if (entschieden) return;
  const sig = SAETZE[satzNr].split(" ").find(istSignal);
  if (!!sig === gerundet) {
    entschieden = true; b.classList.add("richtig");
    signal.querySelectorAll(".wort").forEach(w => { if (istSignal(w.textContent)) w.classList.add("leucht"); });
    T.melde(rueck, "ok", sig ? `${T.lob()} „${sig}“ verrät: Die Zahl ist gerundet.` : `${T.lob()} Kein Signalwort: Die Zahl ist genau.`);
    T.fertig(rf === 0);
  } else { rf++; b.classList.add("weg"); T.melde(rueck, "noch", "Noch nicht. Suche ein verräterisches Wort."); }
}
if (!T.runde({ id: "schulfest", neu: () => { modus = "signal"; rf = 0; neu(); return "fest-" + satzNr; } })) neu();
</script>
</body>
</html>
