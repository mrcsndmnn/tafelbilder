<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Suchmaschinen sollen diese Seite nicht aufnehmen -->
<meta name="robots" content="noindex, nofollow">
<title>Fehler-Detektiv – Runden</title>
<link rel="stylesheet" href="../../zahlenraum-1000/gemeinsam/tafel.css?v=2026112802">
<link rel="stylesheet" href="../gemeinsam/runden.css?v=2026112802">
<link rel="stylesheet" href="../../../gemeinsam/lehrkraftmenue.css?v=2026112802">
<style>
.mitte-gl{position:absolute;left:0;width:1600px;top:180px;text-align:center;font-size:130px;font-weight:700;line-height:1.1;white-space:nowrap}
.mitte-gl .alt{position:relative;color:#8d9892;margin-right:.25em}
.mitte-gl .alt::after{content:"";position:absolute;left:-.08em;right:-.08em;top:52%;height:.07em;background:var(--noch);transform:rotate(-8deg)}
.mitte-gl.ok-rahmen>span.inner{outline:7px solid var(--ok);outline-offset:18px;border-radius:18px}
.karten{position:absolute;left:0;width:1600px;top:430px;display:flex;justify-content:center;gap:40px;flex-wrap:wrap}
.karten .knopf{min-width:300px;min-height:110px;font-size:46px;border-width:3px;background:#fff}
.karten .knopf.zahlk{font-size:60px;min-width:260px}
.karten .knopf.weg{opacity:.3}
.karten .knopf.richtig{border-color:var(--ok);border-width:7px}
.karten.arten .knopf{min-width:0;font-size:30px;min-height:80px}
.kleinberg{position:absolute;left:1180px;top:420px;width:380px}
.bau{position:absolute;left:0;width:1600px;top:150px;display:flex;justify-content:center;gap:80px;align-items:flex-start}
.bau .stellen{display:flex;gap:22px}
.bau .stelle{display:flex;flex-direction:column;align-items:center;gap:10px}
.bau .stelle .kopf2{font-size:28px;font-weight:700;color:#6d7772}
.bau .stelle .ziffer{font-size:96px;font-weight:700;line-height:1}
.bau .stelle .knopf{min-width:80px;font-size:28px}
.bau .rechts{display:flex;flex-direction:column;gap:18px;max-width:640px}
.bau .rechts .frage{font-size:40px;font-weight:700}
.bau .ergebnisse{display:flex;flex-wrap:wrap;gap:14px}
.bau .ergebnisse .knopf{font-size:34px;min-width:120px}
</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<script>
window.HINWEISE = {
 titel: "Fehler-Detektiv",
 teile: [
  { h: "Worum geht es?", text: "Auf einem Zettel stehen sechs Rundungen, einige sind falsch. Sie erscheinen nacheinander, immer nur eine." },
  { h: "So geht es", punkte: [
    "Die Kinder entscheiden: **Stimmt** oder **Stimmt nicht**.",
    "Bei einem Fehler wählen sie aus zwei Zahlen die richtige Rundung. Die falsche Zahl wird durchgestrichen.",
    "Auf Stufe 3 (oder mit der Hilfe **Fehlerart fragen**) sagen sie zum Schluss, was falsch war.",
    "**Weiter** zeigt die nächste Rundung. Die Punkte unten links zeigen den Fortschritt." ] },
  { h: "Im Lehrkraftmenü", punkte: [
    "**Runden auf**, **Stufe** (1: Richtung und Mitte, 2: auch falsche Stelle und falscher Nachbar, 3: mit „zweimal gerundet“), **Fehler selbst bauen** (ein Kind baut eine falsche Rundung, das andere findet sie).",
    "**Auflösen** zeigt alle Fehler. Hilfe **Berg zeigen** blendet einen kleinen Rundungsberg ein." ] } ]
};
</script>
<script src="../../../gemeinsam/uebungsrunde/runde-client.js?v=2026112802"></script>
<script src="../../zahlenraum-1000/gemeinsam/tafel.js?v=2026112802"></script>
<script src="../../../gemeinsam/lehrkraftmenue.js?v=2026112802"></script>
<script src="../gemeinsam/runden.js?v=2026112802"></script>
<script>
const T = Tafel, R = Runden, S = T.buehne();
const ARTEN = { richtung: "Falsche Richtung", stelle: "Falsche Stelle angeschaut", nachbar: "Falscher Nachbar", kette: "Zweimal gerundet", mitte: "Mitte vergessen" };
let rf = 0, modus = "finden", st = "Z", stufe = 1, gls = [], idx = 0, phase = "", artHilfe = false, bergHilfe = false;

// ---------- Kinderansicht ----------
const auftrag = T.blk(60, 34, 1300, 0, "auftrag-zeile");
const glEl = T.blk(0, 180, 1600, 0, "mitte-gl zahl");
const karten = T.blk(0, 430, 1600, 0, "karten");
const rueck = T.blk(100, 640, 1400, 0, "rueck");
const bergBox = T.blk(1180, 420, 380, 0, "kleinberg");
const bauBox = T.blk(0, 150, 1600, 0, "bau"); bauBox.hidden = true;
const fort = T.blk(0, 0, 0, 0, "fortschritt"); fort.style.left = ""; fort.style.top = "";
const weiterKn = T.knopf("Weiter", () => weiter(), "haupt");
T.kinderknoepfe(weiterKn);

// ---------- Lehrkraftmenü ----------
const stWahl = T.gruppe("Runden auf", [{ wert: "Z", text: "Zehner" }, { wert: "H", text: "Hunderter" }], "Z", v => { st = v; neu(); }, "fd-st");
const stufenWahl = T.gruppe("Stufe", [{ wert: 1, text: "1" }, { wert: 2, text: "2" }, { wert: 3, text: "3" }], 1, v => { stufe = v; neu(); }, "fd-stufe");
st = stWahl.wert; stufe = stufenWahl.wert;
const artKn = T.schalter("Fehlerart fragen", false, v => { artHilfe = v; });
const bergKn = T.schalter("Berg zeigen", false, v => { bergHilfe = v; zeigeBerg(); });
T.kopf({ menue: true, titel: "Fehler-Detektiv", beschreibung: "Stimmt die Rundung? Fehler finden und verbessern.", satzmuster: false,
  onNeu: () => { modus = "finden"; neu(); }, onLoesung: () => aufloesen(), extra: [stWahl, stufenWahl], hilfen: [artKn, bergKn] });
T.menue.aufgabe(T.knopf("Fehler selbst bauen", () => { modus = "bauen"; neu(); T.menue.schliessen(); }));

// ---------- Erzeugen ----------
function falsch(art) {
  const b = R.BASIS[st];
  for (let v = 0; v < 500; v++) {
    let n = R.zufallsZahl(st, 2), shown;
    const x = R.nachbarn(n, st), r = R.runde(n, st);
    if (art === "richtung") { if (x.rund || R.istMitte(n, st)) continue; shown = r === x.u ? x.o : x.u; }
    if (art === "mitte") { n = st === "Z" ? T.zufall(2, 98) * 10 + 5 : T.zufall(1, 9) * 100 + 50; shown = R.nachbarn(n, st).u; }
    if (art === "stelle") shown = R.runde(n, R.ANDERE[st]);
    if (art === "nachbar") { if (x.rund) continue; shown = T.wahl([x.u - b, x.o + b].filter(z => z >= 0 && z <= 1000)); }
    if (art === "kette") { n = T.zufall(1, 8) * 100 + 40 + T.zufall(5, 9); shown = R.runde(R.runde(n, "Z"), "H"); }
    const rr = R.runde(n, st);
    if (shown == null || shown === rr || shown === n) continue;
    const p = passende(n, shown); if (p[0] !== art || p.length !== (art === "kette" ? 2 : 1)) continue;
    return { n, shown, r: rr, art };
  }
}
function passende(n, shown) {
  const x = R.nachbarn(n, st), r = R.runde(n, st), l = [];
  if (shown === r) return l;
  if (st === "H" && shown === R.runde(R.runde(n, "Z"), "H")) l.push("kette");
  if (shown === R.runde(n, R.ANDERE[st])) l.push("stelle");
  if (shown === x.u || shown === x.o) l.push(R.istMitte(n, st) && shown === x.u ? "mitte" : "richtung");
  else l.push("nachbar");
  return l;
}
function fehlerSatz(g, art) {
  const d = R.pruefziffer(g.n, st), x = R.nachbarn(g.n, st);
  return {
    richtung: `Bei ${d} runden wir ${d >= 5 ? "auf" : "ab"}.`,
    stelle: `Wir runden auf ${R.NAME[st]}, nicht auf ${R.NAME[R.ANDERE[st]]}.`,
    nachbar: `${g.n} liegt zwischen ${x.u} und ${x.o}.`,
    kette: "Nur einmal runden: Wir schauen nur auf die Zehner.",
    mitte: "Genau in der Mitte runden wir auf.",
  }[art || g.art];
}
function baueZettel(eigene) {
  const arten = stufe === 1 ? ["richtung", "mitte"] : stufe === 2 ? ["richtung", "mitte", "stelle", "nachbar"] : ["richtung", "mitte", "stelle", "nachbar"].concat(st === "H" ? ["kette"] : []);
  const liste = [];
  if (eigene) liste.push(eigene);
  else for (const a of T.mischen(arten).concat(T.mischen(arten), arten)) { if (liste.length === stufe) break; const f = falsch(a); if (f && !liste.some(g => g.n === f.n)) liste.push(f); }
  while (liste.length < 6) {
    const n = R.zufallsZahl(st, stufe === 1 ? 1 : 2);
    if (!liste.some(g => g.n === n)) liste.push({ n, shown: R.runde(n, st), r: R.runde(n, st), art: null });
  }
  gls = T.mischen(liste).map(g => ({ ...g, status: "offen" })); idx = 0;
}

// ---------- Anzeige ----------
function fortschritt() {
  fort.innerHTML = gls.map((g, i) => `<i class="${g.status !== "offen" ? "voll" : i === idx ? "jetzt" : ""}"></i>`).join("");
  fort.setAttribute("aria-label", `Rundung ${idx + 1} von ${gls.length}`);
}
function zeigeGl() {
  const g = gls[idx];
  glEl.classList.toggle("ok-rahmen", g.status !== "offen");
  glEl.innerHTML = `<span class="inner">${g.status === "gefunden"
    ? `${R.zahl(g.n)}<span class="ca">≈</span><span class="alt">${g.shown}</span>${R.zahl(g.r)}`
    : `${R.zahl(g.n)}<span class="ca">≈</span>${R.zahl(g.shown)}`}</span>`;
}
function zeigeBerg() {
  bergBox.innerHTML = ""; bergBox.hidden = !bergHilfe || modus !== "finden" || !gls[idx]; if (bergBox.hidden) return;
  const g = gls[idx], b = R.berg(bergBox, { breite: 380 }), base = Math.floor(g.n / R.BASIS[st]) * R.BASIS[st], d = R.pruefziffer(g.n, st), seite = d >= 5 ? "o" : "u";
  b.fuesse(base, base + R.BASIS[st]); b.kugel(d, S.classList.contains("farben") ? R.FARBE[st] : "#1d2320", true); b.rolle(seite); b.fuss(seite);
}
function zeigeFrage() {
  const g = gls[idx]; phase = "frage"; karten.className = "blk karten"; karten.innerHTML = "";
  auftrag.textContent = `Stimmt die Rundung? (auf ${R.NAME[st]})`;
  karten.append(T.knopf("Stimmt", () => urteil(true)), T.knopf("Stimmt nicht", () => urteil(false)));
  zeigeGl(); fortschritt(); zeigeBerg(); T.melde(rueck, "", ""); weiterKn.hidden = true;
}

// ---------- Ablauf ----------
function neu() {
  T.stop(); rf = 0;
  const finden = modus === "finden";
  [glEl, karten, fort].forEach(e => e.hidden = !finden); bauBox.hidden = finden;
  if (finden) { baueZettel(); zeigeFrage(); } else baueStart();
}
function urteil(stimmt) {
  if (phase !== "frage") return;
  const g = gls[idx];
  if (!g.art && stimmt) { g.status = "ok"; fertigEins(`${T.lob()} ${R.kurzSatz(g.n, st)}`); }
  else if (g.art && !stimmt) {
    phase = "verbessern"; auftrag.textContent = "Was ist richtig?";
    const x = R.nachbarn(g.n, st), b = R.BASIS[st];
    const alt = T.wahl([x.u, x.o, x.u - b, x.o + b].filter(z => z !== g.r && z !== g.shown && z >= 0 && z <= 1000));
    karten.innerHTML = ""; T.mischen([g.r, alt]).forEach(z => { const k = T.knopf(String(z), () => verbessere(z, k), "zahlk"); karten.appendChild(k); });
    T.melde(rueck, "ok", "Gut gesehen!");
  }
  else { rf++; T.melde(rueck, "noch", g.art ? "Noch nicht. Schau noch einmal genau." : "Noch nicht. Die Rundung stimmt."); }
}
function verbessere(z, k) {
  const g = gls[idx];
  if (z !== g.r) { rf++; k.classList.add("weg"); k.disabled = true; return T.melde(rueck, "noch", "Noch nicht. Schau auf die " + R.PRUEFNAME[st] + "ziffer."); }
  g.status = "gefunden"; k.classList.add("richtig"); zeigeGl();
  if (stufe === 3 || artHilfe) {
    phase = "art"; auftrag.textContent = "Was war falsch?"; karten.className = "blk karten arten"; karten.innerHTML = "";
    const moegl = ["richtung", "stelle", "nachbar", "mitte"].concat(stufe === 3 && st === "H" ? ["kette"] : []);
    moegl.forEach(a => { const b = T.knopf(ARTEN[a], () => fehlerart(a, b)); karten.appendChild(b); });
    T.melde(rueck, "ok", `${T.lob()} Richtig ist ${g.r}.`);
  } else fertigEins(`${T.lob()} Richtig ist ${g.r}. ${fehlerSatz(g)}`);
}
function fehlerart(a, b) {
  const g = gls[idx];
  if (!passende(g.n, g.shown).includes(a)) { rf++; b.disabled = true; b.classList.add("weg"); return T.melde(rueck, "noch", "Noch nicht."); }
  b.classList.add("richtig"); fertigEins(`${T.lob()} ${fehlerSatz(g, a)}`);
}
function fertigEins(text) {
  phase = "fertig"; zeigeGl(); fortschritt();
  if (karten.querySelector(".richtig") == null) karten.innerHTML = "";
  const alle = gls.every(g => g.status !== "offen");
  T.melde(rueck, "ok", alle ? text + " Alle geprüft!" : text);
  weiterKn.hidden = false; weiterKn.textContent = alle ? "Neuer Zettel" : "Weiter";
  if (alle) T.fertig(rf === 0);
}
function weiter() {
  if (modus !== "finden") return;
  if (gls.every(g => g.status !== "offen")) return neu();
  idx = gls.findIndex((g, i) => i > idx && g.status === "offen"); if (idx < 0) idx = gls.findIndex(g => g.status === "offen");
  zeigeFrage();
}
function aufloesen() {
  if (modus !== "finden") return;
  gls.forEach(g => { if (g.status === "offen") g.status = g.art ? "gefunden" : "ok"; });
  auftrag.textContent = "Auflösung"; karten.innerHTML = "";
  const f = gls.filter(g => g.art).map(g => `${g.n} ≈ ${g.r} (nicht ${g.shown})`);
  zeigeGl(); fortschritt(); phase = "fertig";
  T.melde(rueck, "grau", "Falsch waren: " + f.join(" · "));
  weiterKn.hidden = false; weiterKn.textContent = "Neuer Zettel";
}

// ---------- Fehler selbst bauen ----------
let bauZahl = 0, bauWahl = null;
function baueStart() {
  bauZahl = R.zufallsZahl(st, 2); bauWahl = null; weiterKn.hidden = true; zeichneBau();
  auftrag.textContent = "Baue eine falsche Rundung."; T.melde(rueck, "", "");
  T.melde(rueck, "grau", "Das andere Kind schaut nicht hin.");
}
function zeichneBau() {
  const s = T.stellen(bauZahl), b = R.BASIS[st], x = R.nachbarn(bauZahl, st);
  bauBox.innerHTML = "";
  const stellen = T.el("div", "stellen"); bauBox.appendChild(stellen);
  [["H", 100], ["Z", 10], ["E", 1]].forEach(([k, w]) => {
    const sp = T.el("div", "stelle");
    sp.append(T.el("div", "kopf2", k), T.knopf("▲", () => aendere(w)), T.el("div", "ziffer zahl", `<span class="${k.toLowerCase()}">${s[k] || 0}</span>`), T.knopf("▼", () => aendere(-w)));
    stellen.appendChild(sp);
  });
  const re = T.el("div", "rechts"); bauBox.appendChild(re);
  re.appendChild(T.el("div", "frage", `${bauZahl} ≈ ?`));
  const kand = [...new Set([x.u - b, x.u, x.o, x.o + b, R.runde(bauZahl, R.ANDERE[st]), R.runde(R.runde(bauZahl, "Z"), "H")])].filter(z => z >= 0 && z <= 1000).sort((p, q) => p - q);
  const erg = T.el("div", "ergebnisse"); re.appendChild(erg);
  kand.forEach(z => { const k = T.knopf(String(z), () => { bauWahl = z; zeichneBau(); }); k.setAttribute("aria-pressed", z === bauWahl); erg.appendChild(k); });
  const fertigKn = T.knopf("Fertig gebaut", () => verstecken(), "haupt"); fertigKn.disabled = bauWahl === null; re.appendChild(fertigKn);
}
function aendere(d) { const n = bauZahl + d; if (n >= 1 && n <= 999) { bauZahl = n; bauWahl = null; zeichneBau(); } }
function verstecken() {
  const art = passende(bauZahl, bauWahl)[0];
  if (!art) return T.melde(rueck, "noch", "Das ist richtig gerundet. Baue einen Fehler!");
  modus = "finden"; [glEl, karten, fort].forEach(e => e.hidden = false); bauBox.hidden = true;
  baueZettel({ n: bauZahl, shown: bauWahl, r: R.runde(bauZahl, st), art }); zeigeFrage();
}
if (!T.runde({ id: "fehler-detektiv", neu: s => { stufe = s; modus = "finden"; neu(); return "fd-" + gls.map(g => g.n).join("-"); } })) neu();
</script>
</body>
</html>
