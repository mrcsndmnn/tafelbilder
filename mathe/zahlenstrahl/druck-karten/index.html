<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Suchmaschinen sollen diese Seite nicht aufnehmen -->
<meta name="robots" content="noindex, nofollow">
<title>Partnerkarten – Druckvorlage</title>
<link rel="stylesheet" href="../gemeinsam/strahl.css?v=2026112101">
<link rel="stylesheet" href="../gemeinsam/druck.css?v=2026112101">
<style>
.karten{display:grid;grid-template-columns:repeat(4,45mm);grid-template-rows:repeat(6,43.5mm);border-top:.3mm dashed #777;border-left:.3mm dashed #777}
.karte{border-right:.3mm dashed #777;border-bottom:.3mm dashed #777;position:relative;overflow:hidden}
.karte .zahl{position:absolute;left:0;right:0;display:grid;place-items:center;font-weight:700;line-height:1}
.karte.geteilt .zahl{top:0;height:50%;font-size:34pt}
.karte.ganz .zahl{top:0;bottom:0;font-size:40pt}
.karte .falz{position:absolute;left:2mm;right:2mm;top:50%;border-top:.3mm dotted #777}
.karte .falz span{position:absolute;right:0;top:-2.4mm;font-size:6pt;color:#777;background:#fff;padding:0 .8mm}
.karte .kontrolle{position:absolute;left:0;right:0;bottom:0;height:50%;display:grid;place-items:center;transform:rotate(180deg)}
.karte.rueck .kontrolle{top:0;height:100%;transform:none}
.karte .kontrolle .klein{position:absolute;top:1.2mm;left:0;right:0;text-align:center;font-size:8pt;color:#555}
.karte.regel{padding:3mm 3.5mm;font-size:10.5pt;line-height:1.3}
.karte.regel b{display:block;font-size:12pt;margin-bottom:1mm}
.hinweis-schirm{max-width:210mm;font-size:15px;color:#5d6862;margin:0 auto}
</style>
</head>
<body>
<script src="../gemeinsam/strahl.js?v=2026112101"></script>
<script src="../gemeinsam/druck.js?v=2026112101"></script>
<script>
const Z = Strahl, D = Druck;
const ART = { hunderter: "Hunderterzahlen", zehner: "Zehnerzahlen", beliebig: "beliebig" };

function zahlenListe(cfg, rnd) {
  const l = [], art = cfg.bereich === "100" && cfg.art === "hunderter" ? "zehner" : cfg.art, max = cfg.bereich === "100" ? 100 : 1000;
  for (let v = 1; v < max; v++) {
    if (art === "hunderter" ? v % 100 === 0 : art === "zehner" ? v % 10 === 0 && (max === 100 || v % 100 !== 0) : v % 10 !== 0) l.push(v);
  }
  const m = Z.mischen(l, rnd), out = [];
  for (let i = 0; i < 23; i++) out.push(m[i % m.length]);
  return out;
}
// Strahlabschnitt zur Selbstkontrolle
function kontrolle(v, cfg) {
  const d = document.createElement("div"); d.className = "kontrolle";
  let von, bis, schritt, beschr;
  if (cfg.bereich === "1000") {
    if (v % 100 === 0) { von = 0; bis = 1000; schritt = 100; beschr = [0, 500, 1000]; }
    else { von = Math.floor(v / 100) * 100; bis = von + 100; schritt = 10; beschr = "enden"; }
  } else {
    if (v % 10 === 0) { von = 0; bis = 100; schritt = 10; beschr = [0, 50, 100]; }
    else { von = Math.floor(v / 10) * 10; bis = von + 10; schritt = 1; beschr = "enden"; }
  }
  const s = D.strahl(d, { von, bis, schritt, beschriftung: beschr, breite: 40, hoehe: 15, y: 7.5, L: 4, schrift: 3.3, dicke: .3, links: 3, rechts: 4, randLinks: von !== 0 });
  s.markiere({ wert: v, seite: "oben", kasten: false, abstand: 6.5 });
  d.insertAdjacentHTML("beforeend", `<span class="klein">${v}</span>`);
  return d;
}

D.start({
  id: "karten", titel: "Partnerkarten: Wo wohnt die Zahl?", niveau: false, mitLoesung: false, ohneKopf: true,
  optionen: [
    { key: "bereich", label: "Zahlenbereich", werte: [{ wert: "100", text: "0–100" }, { wert: "1000", text: "0–1000" }], std: "1000" },
    { key: "art", label: "Art", werte: [{ wert: "hunderter", text: "Hunderterzahlen" }, { wert: "zehner", text: "Zehnerzahlen" }, { wert: "beliebig", text: "beliebig" }], std: "zehner" },
    { key: "rueck", label: "Kontrolle auf Rückseite", std: false },
  ],
  info: cfg => `0–${cfg.bereich} · ${cfg.bereich === "100" && cfg.art === "hunderter" ? "Zehnerzahlen" : ART[cfg.art]}${cfg.rueck ? " · doppelseitig" : ""}`,
  baue(cfg, rnd) {
    const zahlen = zahlenListe(cfg, rnd);
    const regel = `<b>Spielregel</b>Einer nennt die Zahl. Der andere zeigt sie auf dem Streifen. Dreht die Karte um und prüft.`;
    const vorne = document.createElement("div"); vorne.className = "karten";
    const hinten = document.createElement("div"); hinten.className = "karten";
    const zellen = [null].concat(zahlen);    // Platz 0: Spielregel
    zellen.forEach((v, i) => {
      const k = document.createElement("div");
      if (v === null) { k.className = "karte regel"; k.innerHTML = regel; }
      else if (cfg.rueck) { k.className = "karte ganz"; k.innerHTML = `<div class="zahl">${v}</div>`; }
      else {
        k.className = "karte geteilt"; k.innerHTML = `<div class="zahl">${v}</div><div class="falz"><span>falten</span></div>`;
        k.appendChild(kontrolle(v, cfg));
      }
      vorne.appendChild(k);
    });
    if (!cfg.rueck) return [vorne];
    // Rückseite: Spalten gespiegelt (Drucken: beidseitig, an der langen Kante wenden)
    for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++) {
      const v = zellen[r * 4 + (3 - c)], k = document.createElement("div"); k.className = "karte rueck";
      if (v !== null) k.appendChild(kontrolle(v, cfg));
      hinten.appendChild(k);
    }
    return [vorne, hinten];
  },
  nachZeichnen(cfg) {
    let h = document.querySelector(".hinweis-schirm");
    if (!h) { h = document.createElement("p"); h.className = "hinweis-schirm nicht-drucken"; document.querySelector(".vorschau").before(h); }
    h.textContent = cfg.rueck ? "Doppelseitig drucken, an der langen Kante wenden. Dann liegt jede Kontrolle genau hinter ihrer Zahl."
      : "Jede Karte an der gepunkteten Linie nach hinten falten. Dann steht die Kontrolle auf der Rückseite.";
    h.style.padding = "12px 16px 0";
  },
});
</script>
</body>
</html>
