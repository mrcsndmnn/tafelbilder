/* Deckblatt */

.db-so{display:flex;gap:6mm;align-items:flex-start;border:.35mm solid #b9c2bc;border-radius:3mm;padding:3mm 4mm;font-size:12.5pt;margin-bottom:4mm}

/* Aufgabenseiten */
.ab-seitenkopf{display:flex;gap:6mm;font-size:11pt;color:#5d6862;border-bottom:.3mm solid #b9c2bc;padding-bottom:1.5mm;margin-bottom:4mm}
.ab-seitenkopf span:first-child{flex:1}
.ab-aufgabe{border:.35mm solid #b9c2bc;border-radius:3mm;padding:2.5mm 4mm 3.5mm;margin-bottom:5mm;break-inside:avoid}
.ab-kopf{display:flex;align-items:center;gap:3mm;margin-bottom:2.5mm;font-size:13.5pt;line-height:1.3}
.ab-nr{width:9mm;height:9mm;border-radius:50%;background:#000;color:#fff;font-weight:700;font-size:13pt;display:grid;place-items:center;flex:none}
.ab-sym{display:flex;gap:1mm;flex:none}
.ab-sym svg{width:8mm;height:8mm;border:.3mm solid #8d9892;border-radius:1.5mm;padding:.5mm}
.ab-titel{flex:1}

.ab-karten{display:flex;flex-wrap:wrap;gap:2.5mm 3mm;align-content:flex-start}
.ab-wk{border:.35mm solid #000;border-radius:1.5mm;padding:1mm 3mm;font-size:14pt;background:#fff}

.ab-schreib{display:flex;flex-direction:column;gap:3mm}
.ab-kasten{display:flex;flex-wrap:wrap;gap:2mm 5mm;border:.35mm dashed #000;border-radius:2mm;padding:1.5mm 4mm;margin-bottom:3mm;font-size:13pt}
.ab-saetze{margin:0;padding-left:7mm;font-size:15pt;line-height:2.1}
.ab-saetze.weit{line-height:2.5}
.ab-luecke{display:inline-block;border-bottom:.4mm solid #000;height:7mm;vertical-align:baseline}
.ab-bilder{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}
.ab-bz{display:flex;flex-direction:column;gap:2mm;align-items:center}
.ab-bild{width:40mm;height:29mm;border:.3mm solid #b9c2bc;border-radius:1.5mm;overflow:hidden}
.ab-bild svg{width:100%;height:100%;display:block}
.ab-salat{display:grid;grid-template-columns:1fr 1fr;gap:4mm 8mm}
.ab-salat div{display:flex;flex-direction:column;gap:1.5mm}
.ab-buchst{font-size:17pt;font-weight:700;letter-spacing:.6mm;font-family:"Andika","Comic Sans MS",sans-serif}
.ab-nv{display:flex;flex-direction:column;gap:3mm}
.ab-nvz{display:flex;align-items:center;gap:5mm}
.ab-nvb{width:40mm;display:flex;align-items:center;gap:2mm;font-size:13pt;flex:none}
.ab-nvb svg{width:14mm;height:14mm}
table.ab-tab{border-collapse:collapse;font-size:15pt}
.ab-tab th{border:.4mm solid #000;background:#f1f3f1;padding:1mm 4mm;font-size:12pt}
.ab-tab td{border:.4mm solid #000;height:11mm;min-width:18mm;text-align:center;padding:1mm 2mm}
.ab-tab td.ab-dienes{min-width:60mm;text-align:left}
.ab-mit-tafel{display:grid;grid-template-columns:minmax(0,1fr) 62mm;gap:5mm;align-items:start}
table.ab-100{border-collapse:collapse;font-size:8pt}
.ab-100 td{border:.25mm solid #000;width:6mm;height:5.5mm;text-align:center;padding:0}
/* Lösung */
.loes-liste{font-size:12.5pt;line-height:1.5}
.loes-liste div{border-bottom:.25mm solid #d5ddd7;padding:1.5mm 0}
.loes-liste b{display:inline-block;min-width:8mm}

<body>
<script src="../../../gemeinsam/silben.js"></script>
<script src="../../gemeinsam/inhalte.js?v=2026112301"></script>
<script src="../../gemeinsam/bilder.js?v=2026112301"></script>
<script src="../../gemeinsam/geschichten.js?v=2026112301"></script>
<script src="../../aufgabenspeicher/speicher.js?v=2026112301"></script>
<script src="../../gemeinsam/druck.js?v=2026112301"></script>
<script>
const D = Druck, A = AUFGABEN;
const KLASSEN = ["SEP 1", "SEP 2", "SEP 3", "Klasse 3", "Klasse 4"];
const TEMPO = { langsam: 1.3, mittel: 1, schnell: .8 };

// Klasse von der Startseite übernehmen (gilt nur in diesem Tab)
try { const k = JSON.parse(sessionStorage.getItem("vs-klasse") || '""'); if (k) { const c = JSON.parse(localStorage.getItem("vb-druck-arbeitsauftrag") || "{}"); c.klasse = k; localStorage.setItem("vb-druck-arbeitsauftrag", JSON.stringify(c)); } } catch (e) {}

const FAECHER = Object.keys(A.FAECHER), THEMEN = Object.keys(A.THEMEN);
const themenVon = f => THEMEN.filter(t => A.THEMEN[t].fach === f);
// Welche Bausteine passen zu Klasse und Niveau?
const passend = cfg => A.BAUSTEINE.filter(b => b.klassen.includes(cfg.klasse) && b.niveaus.includes(cfg.niveau));
const themenMit = cfg => { const p = passend(cfg); return THEMEN.filter(t => p.some(b => b.thema === t)); };
const zeitVon = cfg => cfg.zeit === "frei" ? Math.max(5, Math.min(240, +cfg.zeitFrei || 30)) : cfg.zeit;
// Grundeinstellung der Inhalte: alle Fächer und Themen gewählt
const inhaltStd = () => Object.fromEntries(FAECHER.map(f => [f, { an: true, modus: "wahl", themen: Object.fromEntries(themenVon(f).map(t => [t, true])), anzahl: 1 }]));

// Anteile einer Gruppe auf 100 % bringen (10er-Schritte, mindestens 10 %) – gleich für Regler und Planung
const normiere = (ids, roh) => {
  const n = ids.length, w = ids.map(id => Math.max(1, +roh[id] || 0)), s = w.reduce((x, y) => x + y, 0);
  let v = w.map(x => Math.max(10, Math.round(x / s * 10) * 10));
  for (let k = 0; k < 20 && v.reduce((x, y) => x + y, 0) !== 100; k++) {
    const d = 100 - v.reduce((x, y) => x + y, 0), i = d > 0 ? v.indexOf(Math.min(...v)) : v.indexOf(Math.max(...v));
    v[i] += d > 0 ? 10 : -10;
  }
  return Object.fromEntries(ids.map((id, i) => [id, n === 1 ? 100 : v[i]]));
};
// ---------- Planung: Themen bestimmen, nach Gewichtung und Zeit Aufgaben auswählen ----------
function plane(cfg, rnd) {
  const da = themenMit(cfg), inh = cfg.inhalt || inhaltStd(), gF = cfg.gFach || {}, gT = cfg.gewichte || {};
  // 1. Themen je Fach: selbst gewählt oder zufällig
  const wahl = {};
  FAECHER.forEach(f => {
    const e = inh[f]; if (!e || !e.an) return;
    const k = themenVon(f).filter(t => da.includes(t));
    const l = e.modus === "zufall" ? D.mischen(k, rnd).slice(0, e.anzahl === "alle" ? k.length : +e.anzahl || 1) : k.filter(t => e.themen && e.themen[t]);
    if (l.length) wahl[f] = l;
  });
  const faecher = Object.keys(wahl);
  if (!faecher.length) return { liste: [], wahl };
  // 2. Gewichte: Fach (bei mehreren Fächern) × Thema (bei selbst gewählten Themen)
  const nF = normiere(faecher, gF), wF = f => nF[f], sF = 100;
  const gewicht = {};
  faecher.forEach(f => {
    const zufall = inh[f].modus === "zufall", nT = normiere(wahl[f], gT), wT = t => zufall ? 1 : nT[t], sT = wahl[f].reduce((s, t) => s + wT(t), 0);
    wahl[f].forEach(t => { gewicht[t] = sF && sT ? wF(f) / sF * wT(t) / sT : 0; });
  });
  const themen = Object.keys(gewicht).filter(t => gewicht[t] > 0);
  if (!themen.length) return { liste: [], wahl };
  // 3. Aufgaben auswählen: immer das Thema mit dem größten Rückstand
  const faktor = TEMPO[cfg.tempo] || 1, budget = zeitVon(cfg) / faktor;   // Minuten im „mittleren“ Tempo
  const ziel = {}, ist = {}, liste = [], stapel = {};
  themen.forEach(t => { ziel[t] = budget * gewicht[t]; ist[t] = 0; stapel[t] = []; });
  const naechster = t => { if (!stapel[t].length) stapel[t] = D.mischen(passend(cfg).filter(b => b.thema === t), rnd); return stapel[t].shift(); };
  for (let i = 0; i < 80; i++) {
    const t = themen.map(x => [x, ziel[x] - ist[x]]).sort((a, b) => b[1] - a[1])[0];
    const b = naechster(t[0]), m = b.minuten[cfg.niveau];
    const gesamt = Object.values(ist).reduce((s, x) => s + x, 0);
    if (gesamt + m > budget + m * .45) break;        // nur hinzufügen, wenn es ungefähr noch passt
    liste.push({ b, m, thema: t[0] }); ist[t[0]] += m;
  }
  if (!liste.length) { const t = themen[0], b = naechster(t); liste.push({ b, m: b.minuten[cfg.niveau], thema: t }); }
  // 4. Reihenfolge: nach Fach, innerhalb des Fachs nach Thema sortiert
  const rang = x => FAECHER.indexOf(A.THEMEN[x.thema].fach) * 100 + THEMEN.indexOf(x.thema);
  liste.forEach((x, i) => { x.i = i; });
  liste.sort((a, b) => rang(a) - rang(b) || a.i - b.i);
  return { liste, wahl, faktor };
}

// ---------- Seitenumbruch: Teile nacheinander auf A4-Seiten verteilen ----------
function verteile(kopf, bloecke, cfg) {
  const m = document.createElement("section"); m.className = "blatt" + (cfg.schrift === "druck" ? "" : " silben");
  m.style.cssText = "position:absolute;left:-30000px;top:0;height:auto;visibility:hidden";
  const innen = document.createElement("div"); innen.className = "innen"; innen.style.height = "auto"; m.appendChild(innen); document.body.appendChild(m);
  const mm = (() => { const t = document.createElement("div"); t.style.height = "100mm"; m.appendChild(t); const h = t.getBoundingClientRect().height / 100; t.remove(); return h; })();
  const max = 259 * mm, seiten = [];
  let akt = [];
  const hoehe = teile => { innen.innerHTML = kopf(seiten.length + 1) + teile.join(""); return innen.getBoundingClientRect().height; };
  bloecke.forEach(b => { if (akt.length && hoehe(akt.concat(b)) > max) { seiten.push(akt); akt = []; } akt.push(b); });
  if (akt.length) seiten.push(akt);
  m.remove();
  return seiten.map((s, i) => kopf(i + 1) + s.join(""));
}

// Kleine Bausteine für die linke Spalte
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const kn = (text, an, fn) => { const b = el("button", "", text); b.type = "button"; b.setAttribute("aria-pressed", !!an); b.addEventListener("click", fn); return b; };

let letzterPlan = null;
D.start({
  id: "arbeitsauftrag", titel: "Arbeitsauftrag zusammenstellen", nr: "G-A", lineatur: true, klassensatz: true, ohneKopf: true,
  optionen: [
    { key: "zeit", label: "1. Bearbeitungszeit", std: 30, werte: [15, 20, 30, 45, 60, 90].map(m => ({ wert: m, text: m + " Min." })).concat([{ wert: "frei", text: "eigene Angabe" }]) },
    { key: "klasse", label: "2. Klassenstufe", std: "SEP 2", werte: KLASSEN.map(k => ({ wert: k, text: k })) },
    { key: "tempo", label: "Arbeitstempo", std: "mittel", werte: [{ wert: "langsam", text: "langsam" }, { wert: "mittel", text: "mittel" }, { wert: "schnell", text: "schnell" }] },
  ],
  steuer(st, cfg, aendern) {
    if (!cfg.inhalt) cfg.inhalt = inhaltStd();
    FAECHER.forEach(f => { if (!cfg.inhalt[f]) cfg.inhalt[f] = inhaltStd()[f]; });
    if (!cfg.gFach) cfg.gFach = Object.fromEntries(FAECHER.map(f => [f, 50]));
    if (!cfg.gewichte) cfg.gewichte = Object.fromEntries(THEMEN.map(t => [t, 50]));
    if (!cfg.zeitFrei) cfg.zeitFrei = 40;
    const kopie = o => JSON.parse(JSON.stringify(o));
    const setzeInhalt = (f, aend) => { const i = kopie(cfg.inhalt); aend(i[f]); aendern("inhalt", i); };

    // Freie Zeitangabe (wird unter „1. Bearbeitungszeit“ eingeblendet)
    const frei = el("div", "gruppe zeit-frei", `<label class="glabel" for="zeitFrei">Eigene Bearbeitungszeit in Minuten</label><input id="zeitFrei" type="number" min="5" max="240" step="5">`);
    const fi = frei.querySelector("input"); fi.value = cfg.zeitFrei;
    fi.addEventListener("change", () => { const v = Math.max(5, Math.min(240, parseInt(fi.value, 10) || 30)); fi.value = v; aendern("zeitFrei", v); });
    st.appendChild(frei);

    const wahlBox = el("div", "gruppe inhalte"); wahlBox.setAttribute("aria-label", "Inhalte wählen"); st.appendChild(wahlBox);
    const gewBox = el("div", "gruppe gewicht"); gewBox.setAttribute("aria-label", "Gewichtung"); st.appendChild(gewBox);
    const info = el("div", "plan-info"); info.setAttribute("aria-live", "polite"); st.appendChild(info);

    // Gekoppelte Regler: Die Anteile einer Gruppe ergeben immer zusammen 100 %.
    // Zieht man einen Regler hoch, werden die anderen im gleichen Verhältnis kleiner (mindestens 10 %).
    const verteileNeu = (ids, werte, id, neu) => {
      const andere = ids.filter(x => x !== id), max = 100 - 10 * andere.length;
      neu = Math.max(10, Math.min(max, Math.round(neu / 10) * 10));
      const rest = 100 - neu, alt = andere.reduce((x, y) => x + werte[y], 0);
      const r = { [id]: neu };
      // Rest im bisherigen Verhältnis verteilen, auf 10er runden, Rundungsfehler beim größten ausgleichen
      andere.forEach(x => { r[x] = Math.max(10, Math.round((alt ? werte[x] / alt : 1 / andere.length) * rest / 10) * 10); });
      for (let k = 0; k < 20; k++) {
        const d = 100 - ids.reduce((x, y) => x + r[y], 0); if (!d) break;
        const kand = andere.filter(x => d > 0 || r[x] > 10); if (!kand.length) break;
        const ziel = kand.reduce((a, b) => (d > 0 ? r[a] <= r[b] : r[a] >= r[b]) ? a : b);
        r[ziel] += d > 0 ? 10 : -10;
      }
      return r;
    };
    const reglerGruppe = (titel, ids, label, roh, speichern, zusatz) => {
      if (ids.length < 2) return;
      let werte = normiere(ids, roh);
      gewBox.appendChild(el("h3", "", titel));
      const zeilen = {};
      ids.forEach(id => {
        const d = el("div", "th", `<label for="r-${id}">${label(id)}</label><span class="wert"></span><input id="r-${id}" type="range" min="0" max="100" step="10"><span class="zus"></span>`);
        zeilen[id] = d; gewBox.appendChild(d);
        const inp = d.querySelector("input");
        inp.addEventListener("input", () => { werte = verteileNeu(ids, werte, id, +inp.value); zeige(); });
        inp.addEventListener("change", () => speichern(werte));
      });
      const zeige = () => ids.forEach(id => { const d = zeilen[id]; d.querySelector("input").value = werte[id]; d.querySelector(".wert").textContent = werte[id] + " %";
        d.querySelector(".zus").textContent = zusatz ? zusatz(id, werte[id]) : ""; });
      zeige();
      gewBox.appendChild(el("span", "summe", `Zusammen: 100 %`));
    };
    // 3. Inhalte wählen: Fach an/aus, Themen per Häkchen oder zufällig
    const zeichneWahl = () => {
      const da = themenMit(cfg);
      wahlBox.innerHTML = '<span class="glabel">3. Inhalte wählen</span>';
      FAECHER.forEach(f => {
        const e = cfg.inhalt[f], verf = themenVon(f).filter(t => da.includes(t));
        const fb = el("div", "fach" + (e.an ? "" : " zu"));
        const cb = el("label", "haken fachname", `<input type="checkbox" ${e.an && verf.length ? "checked" : ""} ${verf.length ? "" : "disabled"}> ${A.FAECHER[f]}`);
        cb.querySelector("input").addEventListener("change", ev => setzeInhalt(f, x => { x.an = ev.target.checked; }));
        fb.appendChild(cb);
        if (!verf.length) fb.appendChild(el("span", "warum", `Für ${cfg.klasse} auf Niveau ${"★".repeat(cfg.niveau)} noch keine Aufgaben.`));
        else if (e.an) {
          const mod = el("div", "knoepfe");
          mod.append(kn("Themen wählen", e.modus === "wahl", () => setzeInhalt(f, x => { x.modus = "wahl"; })),
            kn("Zufällige Themen", e.modus === "zufall", () => setzeInhalt(f, x => { x.modus = "zufall"; })));
          fb.appendChild(mod);
          if (e.modus === "wahl") {
            themenVon(f).forEach(t => {
              const ok = da.includes(t);
              const l = el("label", "haken" + (ok ? "" : " aus"), `<input type="checkbox" ${e.themen[t] && ok ? "checked" : ""} ${ok ? "" : "disabled"}> ${A.THEMEN[t].titel}${ok ? "" : ' <span class="warum">(nicht für diese Klasse/dieses Niveau)</span>'}`);
              l.querySelector("input").addEventListener("change", ev => setzeInhalt(f, x => { x.themen[t] = ev.target.checked; }));
              fb.appendChild(l);
            });
          } else {
            const an = el("div", "knoepfe", '<span class="klein">Wie viele Themen?</span>');
            [1, 2, "alle"].filter(n => n === "alle" || n <= verf.length).forEach(n => an.appendChild(kn(n === "alle" ? "alle" : String(n), String(e.anzahl) === String(n), () => setzeInhalt(f, x => { x.anzahl = n; }))));
            fb.appendChild(an);
            fb.appendChild(el("span", "klein", `Zufällig aus: ${verf.map(t => A.THEMEN[t].titel).join(", ")}. Jedes Blatt kann andere Themen bekommen.`));
          }
        }
        wahlBox.appendChild(fb);
      });
    };
    // 4. Gewichtung – erst, wenn Inhalte gewählt sind
    const zeichneGewichte = () => {
      const p = letzterPlan, gew = p ? Object.keys(p.wahl || {}) : [];
      gewBox.innerHTML = '<span class="glabel">4. Gewichtung</span>';
      if (!gew.length) { gewBox.appendChild(el("span", "klein", "Zuerst oben Fächer und Themen wählen.")); return; }
      // Anteil der Fächer am ganzen Auftrag
      const fachAnteil = gew.length > 1 ? normiere(gew, cfg.gFach) : { [gew[0]]: 100 };
      if (gew.length === 1) gewBox.appendChild(el("span", "klein", `Nur ${A.FAECHER[gew[0]]} gewählt: 100 % des Auftrags.`));
      reglerGruppe("Anteil der Fächer am Auftrag", gew, f => A.FAECHER[f], cfg.gFach, w => aendern("gFach", Object.assign({}, cfg.gFach, w)));
      // Anteil der Themen innerhalb eines Fachs
      gew.forEach(f => {
        const e = cfg.inhalt[f];
        if (e.modus === "zufall") { gewBox.appendChild(el("span", "klein", `${A.FAECHER[f]}: zufällige Themen, gleich verteilt.`)); return; }
        const th = p.wahl[f];
        if (th.length < 2) { gewBox.appendChild(el("span", "klein", `${A.FAECHER[f]}: nur ein Thema gewählt – es bekommt den ganzen Anteil des Fachs.`)); return; }
        reglerGruppe(`Themen innerhalb von ${A.FAECHER[f]}`, th, t => A.THEMEN[t].titel.replace("Zahlen bis 100: ", ""), cfg.gewichte,
          w => aendern("gewichte", Object.assign({}, cfg.gewichte, w)),
          (t, v) => `= ${Math.round(v * fachAnteil[f] / 100)} % des ganzen Auftrags`);
      });
      gewBox.appendChild(el("span", "klein", "Die Regler einer Gruppe hängen zusammen und ergeben immer 100 %. Zieht man einen hoch, werden die anderen kleiner. Jedes gewählte Thema bekommt mindestens 10 %."));
    };
    // nach jedem Neuzeichnen: Bedienelemente und Planungsinfo aktualisieren
    window.__nachZeichnen = () => {
      frei.hidden = cfg.zeit !== "frei";
      zeichneWahl(); zeichneGewichte();
      const p = letzterPlan, zeit = zeitVon(cfg);
      if (!p || !p.liste.length) { info.className = "plan-info warn";
        info.textContent = themenMit(cfg).length ? "Bitte mindestens ein Fach und ein Thema wählen (Gewichtung über 0 %)."
          : `Für ${cfg.klasse} auf Niveau ${"★".repeat(cfg.niveau)} gibt es im Aufgabenspeicher noch keine Aufgaben. Er wächst mit jeder ausgewerteten Vorlage.`; return; }
      const min = Math.round(p.liste.reduce((s, x) => s + x.m, 0) * p.faktor), proFach = {};
      p.liste.forEach(x => { const f = A.FAECHER[A.THEMEN[x.thema].fach]; proFach[f] = (proFach[f] || 0) + x.m * p.faktor; });
      const abw = Math.abs(min - zeit) > Math.max(5, zeit * .2);
      const zufall = Object.keys(p.wahl).filter(f => cfg.inhalt[f].modus === "zufall");
      info.className = "plan-info" + (abw ? " warn" : "");
      info.innerHTML = `<b>${p.liste.length} Aufgaben, ca. ${min} Minuten</b> (gewünscht: ${zeit})<br>` +
        Object.entries(proFach).map(([f, m]) => `${f}: ${Math.round(m / min * 100)} %`).join(" · ") +
        (zufall.length ? "<br>Zufällig gewählt (1. Blatt): " + zufall.map(f => p.wahl[f].map(t => A.THEMEN[t].titel).join(", ")).join("; ") : "") +
        (abw ? "<br>Mit diesen Themen passt die Zeit nicht genau. Mehr Themen zulassen oder Zeit ändern." : "");
    };
  },
  nachZeichnen: () => window.__nachZeichnen && window.__nachZeichnen(),
  info: cfg => `${zeitVon(cfg)} Min. · ${cfg.klasse}${cfg.tempo !== "mittel" ? " · Tempo " + cfg.tempo : ""}`,
  baue(cfg, rnd, loesung, nummer, k) {
    const p = plane(cfg, rnd); if (k === 0) letzterPlan = p;
    if (!p.liste.length) return loesung ? [] : [`<p>${themenMit(cfg).length ? "Es ist noch kein Inhalt gewählt. Links mindestens ein Fach und ein Thema wählen." : "Für diese Klasse und dieses Niveau gibt es im Aufgabenspeicher noch keine Aufgaben."}</p>`];
    // jede Aufgabe mit eigenem Zufall bauen (gleich für Aufgabe und Lösung)
    const aufgaben = p.liste.map((x, i) => { const r = D.zufallMit(nummer * 131 + x.i * 7 + 3); const e = x.b.baue(cfg.niveau, r, D, cfg); return Object.assign({ nr: i + 1, x, fach: A.THEMEN[x.thema].fach }, e); });
    const minuten = a => Math.round(a.x.m * p.faktor), gesamt = aufgaben.reduce((s, a) => s + a.x.m, 0) * p.faktor;
    const neuesFach = (a, i) => i === 0 || aufgaben[i - 1].fach !== a.fach;
    if (loesung) {   // Lösungsblatt: Übersicht mit Zeiten, dann Lösungen nach Fächern
      const uebersicht = `<table class="db-liste${aufgaben.length > 11 ? " eng" : ""}"><tr><th></th><th>Aufgabe</th><th>Thema</th><th>Zeit</th></tr>` +
        aufgaben.map((a, i) => (neuesFach(a, i) ? `<tr class="fz"><td colspan="4">${A.FAECHER[a.fach]}</td></tr>` : "") +
          `<tr><td class="nr">${a.nr}</td><td>${a.x.b.titel}</td><td class="thema">${A.THEMEN[a.x.thema].titel.replace("Zahlen bis 100: ", "")}</td><td class="min">ca. ${minuten(a)} Min.</td></tr>`).join("") +
        `<tr><td></td><td><b>Zusammen</b></td><td></td><td class="min"><b>ca. ${Math.round(gesamt)} Min.</b></td></tr></table>`;
      return verteile(sl => sl === 1 ? `<div class="db-titel"><h2>Lösung zum Arbeitsauftrag</h2></div>` : `<div class="ab-seitenkopf"><span>Lösung zum Arbeitsauftrag</span><span>Seite ${sl}</span></div>`,
        [uebersicht].concat(aufgaben.map((a, i) => (neuesFach(a, i) ? `<div class="ab-fach">${A.FAECHER[a.fach]}</div>` : "") + `<div class="loes-liste"><div><b>${a.nr}.</b> ${a.x.b.titel}: ${a.loesung}</div></div>`)), cfg);
    }
    // Deckblatt für die Kinder: nach Fächern geordnet, ohne Zeit je Aufgabe
    const zeile = a => `<tr><td class="nr">${a.nr}</td><td>${a.x.b.titel}</td><td class="box">☐</td><td class="box">☐</td></tr>`;
    const deckTeile = [`<div class="db-felder"><span>Name:</span><span>Datum:</span></div>
      <div class="db-so">${D.bild("stern")}<div><b>${D.w("So ar-bei-test du:")}</b><ol><li>${D.w("Ar-bei-te der Rei-he nach.")}</li><li>${D.w("Mach ei-nen Ha-ken, wenn du fer-tig bist.")}</li>
        <li>${D.w("Lass dei-ne Ar-beit kon-trol-lie-ren.")}</li></ol></div></div>`];
    FAECHER.forEach(f => {
      const l = aufgaben.filter(a => a.fach === f); if (!l.length) return;
      for (let i = 0; i < l.length; i += 8) deckTeile.push(`<table class="db-liste${aufgaben.length > 11 ? " eng" : ""}"><tr class="fz"><td colspan="2">${A.FAECHER[f]}</td><th>fertig</th><th>kontrolliert</th></tr>${l.slice(i, i + 8).map(zeile).join("")}</table>`);
    });
    deckTeile.push(`<div class="db-so">${D.bild("daumen_hoch")}<div><b>${D.w("Fer-tig?")}</b> ${D.w("Dann lies in dei-nem Buch o-der ma-le ein Bild zu dei-ner Lieb-lings-auf-ga-be.")}</div></div>`);
    const deck = verteile(sl => sl === 1 ? `<div class="db-titel"><h2>Mein Arbeitsauftrag</h2><span class="zeit">${D.bild("uhr")}ca. ${Math.round(gesamt / 5) * 5 || Math.round(gesamt)} Minuten</span></div>`
      : `<div class="ab-seitenkopf"><span>Mein Arbeitsauftrag · Übersicht</span><span></span></div>`, deckTeile, cfg);
    // Aufgabenseiten: nach Fächern, mit Fach-Überschrift
    const bloecke = aufgaben.map((a, i) => `${neuesFach(a, i) ? `<div class="ab-fach">${A.FAECHER[a.fach]}</div>` : ""}<section class="ab-aufgabe"><div class="ab-kopf"><span class="ab-nr">${a.nr}</span><span class="ab-sym">${(a.x.b.symbole || []).map(s => D.bild(s)).join("")}</span>
      <span class="ab-titel">${D.w(a.x.b.auftrag(cfg.niveau))}</span></div>${a.html}</section>`);
    const kopf = s => `<div class="ab-seitenkopf"><span>Mein Arbeitsauftrag · Name: ____________________</span><span>Seite ${s + deck.length}</span></div>`;
    return deck.concat(verteile(kopf, bloecke, cfg));
  },
});
// Reihenfolge links: Bearbeitungszeit (mit eigener Angabe) und Klassenstufe zuerst
(() => { const st = document.querySelector(".steuer"), z = st.querySelector('[aria-label="1. Bearbeitungszeit"]'), n = st.querySelector('[aria-label="Niveau"]');
  if (z && n) { st.insertBefore(z, n); st.insertBefore(st.querySelector(".zeit-frei"), n); st.insertBefore(st.querySelector('[aria-label="2. Klassenstufe"]'), n); } })();
</script>
</body>
