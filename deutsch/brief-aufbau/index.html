<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Briefaufbau an der Tafel</title>
<style>
/* Grundeinstellungen (wie in der Claude-Vorschau, damit alles gleich aussieht) */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

/* Schrift Andika lokal aus dem Ordner "fonts" (kein Google Fonts). Fehlt die Datei, greift die Ersatzschrift. */
@font-face{font-family:"Andika";src:url("../../fonts/Andika-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Andika";src:url("../../fonts/Andika-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

/* Kleiner Link zurück zur Übersicht, oben links am Rand */
.zurueck{position:fixed;left:6px;top:2px;z-index:50;font-family:"Andika","Segoe UI",sans-serif;font-size:13px;line-height:1.4;
  color:#4a554f;text-decoration:none;opacity:.6;padding:1px 6px;border-radius:6px}
.zurueck:hover,.zurueck:focus-visible{opacity:1;text-decoration:underline}
.zurueck:focus-visible{outline:3px solid #2f7d4f;outline-offset:1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .zurueck{color:#a9b4ad}}
:root[data-theme="dark"] .zurueck{color:#a9b4ad}
@media print{.zurueck{display:none}}
</style>
<style>
/* Layout: eine 16:9-Bühne (1600×900), skaliert auf die Tafel. Brief links, Legefelder in der Mitte, Kärtchen-Ablage rechts. */
:root{
  --room:#dfe5e0; --stage:#ffffff; --ink:#1d2320; --soft:#5d6862; --field:#f3f6f2; --tray:#eef2ee;
  --ok:#2f7d4f; --bad:#c0392b; --btn:#1d2320; --btnfg:#ffffff;
  --font:"Andika","Comic Sans MS","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--room:#141816;color-scheme:dark}}
:root[data-theme="dark"]{--room:#141816;color-scheme:dark}
html,body{height:100%}
body{background:var(--room);color:var(--ink);font-family:var(--font);margin:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;
  display:grid;place-items:center;user-select:none;-webkit-user-select:none}
#fit{position:relative;width:100%;height:100%}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;background:var(--stage);border-radius:18px;box-shadow:0 6px 30px rgba(0,0,0,.18);transform-origin:0 0}

h1{position:absolute;left:48px;top:28px;margin:0;font-size:46px}
.auftrag{position:absolute;left:50px;top:92px;font-size:25px;color:var(--ink)}
.say{border:2px solid var(--ink);border-radius:10px;padding:1px 10px;font-weight:700}

.brief{position:absolute;left:48px;top:150px;width:880px;height:736px;border:3px solid var(--ink);border-radius:16px;box-sizing:border-box}
.part{position:absolute;left:30px;font-size:22px;line-height:1.38;border:2px dashed #9aa59f;border-radius:10px;padding:6px 14px;box-sizing:border-box;display:flex;align-items:center}
.farben .part{border-style:solid;border-color:var(--c);background:var(--cbg)}
.link{position:absolute;height:0;border-top:3px dotted var(--ink)}
.link::before{content:"";position:absolute;left:-4px;top:-9px;border-top:7.5px solid transparent;border-bottom:7.5px solid transparent;border-right:11px solid var(--ink)}
.field{position:absolute;width:300px;height:70px;border:3px dashed var(--ink);border-radius:14px;background:var(--field);box-sizing:border-box;transition:background .15s, box-shadow .15s}
.farben .field{border-color:var(--c)}
.field.hover{background:#e3efe6;box-shadow:0 0 0 4px rgba(47,125,79,.25)}
.field .mark{position:absolute;right:-46px;top:50%;transform:translateY(-50%);font-size:34px;font-weight:700;display:none}
.checking .field.ok .mark{display:block;color:var(--ok)}
.checking .field.bad .mark{display:block;color:var(--bad)}
.checking .field.ok{border-style:solid;border-color:var(--ok)}
.checking .field.bad{border-style:solid;border-color:var(--bad)}

.tray{position:absolute;left:1316px;top:150px;width:256px;height:736px;background:var(--tray);border-radius:16px;border:2px solid #c9d1cb;box-sizing:border-box}
.tray b{position:absolute;top:14px;width:100%;text-align:center;font-size:22px;color:var(--soft)}
.card{position:absolute;width:284px;height:60px;border:3px solid #1d2320;border-radius:12px;background:#fff;box-sizing:border-box;
  display:grid;place-items:center;font-size:29px;font-weight:700;cursor:grab;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.2);
  transition:left .18s ease, top .18s ease, transform .1s;z-index:2}
.farben .card{background:var(--cbg);border-color:var(--c)}
.card.drag{cursor:grabbing;transition:none;transform:scale(1.06);z-index:10;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.card.inslot{width:284px}

.bar{position:absolute;left:48px;right:28px;bottom:-2px;transform:translateY(100%);display:flex;gap:12px;flex-wrap:wrap;padding-top:14px}
.ctrl{position:absolute;right:28px;top:28px;display:flex;gap:12px;align-items:center}
.ctrl button,.ctrl label{font-family:var(--font);font-size:21px;border-radius:12px;border:2px solid var(--ink);padding:10px 18px;background:#fff;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.ctrl button.main{background:var(--btn);color:var(--btnfg)}
.ctrl input{width:22px;height:22px;accent-color:#2f7d4f}
.ctrl button:focus-visible,.ctrl label:focus-within{outline:4px solid #2f7d4f;outline-offset:2px}
.lob{position:absolute;right:30px;top:92px;font-size:30px;font-weight:700;color:var(--ok);display:none}
.alldone .lob{display:block}

.c-ort{--c:#2f6fb0;--cbg:#e4eef8}.c-anrede{--c:#b0552f;--cbg:#f8e9e2}.c-einl{--c:#7a4fa8;--cbg:#efe7f7}
.c-text{--c:#2f7d4f;--cbg:#e3f2e8}.c-gruss{--c:#a8871a;--cbg:#f8f1d9}.c-unter{--c:#b03a6a;--cbg:#f8e3ec}
/* Silbenschrift im Brief etwas enger, damit der lange Brieftext in seinen Kasten passt */
.silben .brief .w{margin-right:.24em}
.silben .brief .s{padding-bottom:.27em;line-height:1.08;margin:0 .01em}
.silben .brief .s::after{height:.21em;border-width:2.5px}
.silben .part.c-text{font-size:20px}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>
<link rel="stylesheet" href="../../gemeinsam/silben.css">
<script src="../../gemeinsam/silben.js"></script>
</head>
<body>
<a class="zurueck" href="../../">← Übersicht</a>

<div id="fit"><div id="stage">
  <h1>So ist ein Brief aufgebaut</h1>
  <div class="auftrag">Ziehe jedes Kärtchen in das richtige Feld. Sprich: <span class="say">Das ist die Anrede.</span></div>
  <div class="lob">Super, alles richtig!</div>
  <div class="ctrl">
    <label for="farben"><input type="checkbox" id="farben"> Farben</label>
    <label for="silben"><input type="checkbox" id="silben"> Silben</label>
    <button type="button" id="pruefen" class="main">Prüfen</button>
    <button type="button" id="reset">Neu</button>
  </div>
  <div class="brief" id="brief"></div>
  <div class="tray"><b>Kärtchen</b></div>
</div></div>

<script>
const S=document.getElementById('stage'), fit=document.getElementById('fit');
// Texte mit Silbentrennung: "-" trennt Silben (nur sichtbar, wenn "Silben" angehakt ist)
const parts=[
 {k:"ort",lab:"Ort und Da-tum",txt:"Gel-sen-kir-chen, 2.11.2026",h:62,w:330,right:true},
 {k:"anrede",lab:"An-re-de",txt:"Lie-be Kin-der,",h:62,w:210},
 {k:"einl",lab:"Ein-lei-tung",txt:"wie geht es euch? Mir geht es gut.<br>Ich möch-te euch von mei-nem Hal-lo-ween er-zäh-len.",h:84},
 {k:"text",lab:"Brief-text",txt:"Am Frei-tag ha-be ich mich als Vam-pir ver-klei-det. Ich hat-te ei-nen schwar-zen Um-hang und lan-ge Zäh-ne. Mit mei-nen Freun-den bin ich von Haus zu Haus ge-gan-gen. Wir ha-ben an den Tü-ren ge-klin-gelt und „Sü-ßes o-der Sau-res!“ ge-ru-fen. Wir ha-ben ganz vie-le Sü-ßig-kei-ten be-kom-men. Be-son-ders le-cker wa-ren die Gum-mi-bär-chen und die Scho-ko-la-de. Da-nach ha-ben wir noch ei-nen Gru-sel-film ge-schaut. Das war rich-tig toll!<br>Wie habt ihr Hal-lo-ween ge-fei-ert? Habt ihr euch auch ver-klei-det? Ich freu-e mich auf eu-re Brie-fe.",h:262},
 {k:"gruss",lab:"Gruß",txt:"Vie-le Grü-ße",h:62,w:190},
 {k:"unter",lab:"Un-ter-schrift",txt:"Eu-er Tom",h:62,w:170},
];
const BRIEF={x:48,y:150,w:880}, FX=968, GAP=18;
const brief=document.getElementById('brief');
let y=26; const fields=[];
parts.forEach(p=>{
  const d=document.createElement('div');d.className='part c-'+p.k;d.innerHTML='<span>'+silben(p.txt)+'</span>';
  const w=p.w||BRIEF.w-60; d.style.width=w+'px'; d.style.height=p.h+'px'; d.style.top=y+'px';
  if(p.right){d.style.left='auto';d.style.right='30px'}
  brief.appendChild(d);
  const cy=BRIEF.y+y+p.h/2;
  const l=document.createElement('div');l.className='link';l.style.left=(BRIEF.x+BRIEF.w+6)+'px';l.style.width=(FX-BRIEF.x-BRIEF.w-14)+'px';l.style.top=cy+'px';S.appendChild(l);
  const f=document.createElement('div');f.className='field c-'+p.k;f.dataset.k=p.k;
  f.style.left=FX+'px';f.style.top=(cy-35)+'px';f.innerHTML='<span class="mark"></span>';S.appendChild(f);
  fields.push({el:f,k:p.k,x:FX,y:cy-35,card:null});
  y+=p.h+GAP;
});
const cards=parts.map(p=>{const c=document.createElement('div');c.className='card c-'+p.k;c.innerHTML='<span>'+silben(p.lab)+'</span>';c.setAttribute('aria-label',ohneSilben(p.lab));c.dataset.k=p.k;S.appendChild(c);return {el:c,k:p.k,slot:null}});
const TRAY={x:1316,y:200};
function home(c,i){c.slot=null;c.el.classList.remove('inslot');c.el.style.width='224px';c.el.style.left=(TRAY.x+16)+'px';c.el.style.top=(TRAY.y+12+i*104)+'px';c.el.style.fontSize=c.k==="ort"?'24px':'27px'}
function shuffle(){const idx=[...cards.keys()];for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  fields.forEach(f=>f.card=null);idx.forEach((ci,pos)=>{cards[ci].trayPos=pos;home(cards[ci],pos)});S.classList.remove('checking','alldone');}
function place(c,f){
  if(f.card&&f.card!==c){home(f.card,f.card.trayPos)}
  fields.forEach(o=>{if(o.card===c)o.card=null});
  f.card=c;c.slot=f;c.el.classList.add('inslot');c.el.style.width='284px';c.el.style.fontSize='29px';
  c.el.style.left=(f.x+8)+'px';c.el.style.top=(f.y+5)+'px';
  S.classList.remove('checking','alldone');
}
let scale=1;
function resize(){const r=fit.getBoundingClientRect();scale=Math.min(r.width/1600,r.height/900);
  S.style.transform=`scale(${scale})`;S.style.left=((r.width-1600*scale)/2)+'px';S.style.top=((r.height-900*scale)/2)+'px'}
addEventListener('resize',resize);resize();

let drag=null;
cards.forEach(c=>{
  c.el.addEventListener('pointerdown',e=>{
    e.preventDefault();c.el.setPointerCapture(e.pointerId);
    const sr=S.getBoundingClientRect();
    drag={c,ox:(e.clientX-sr.left)/scale-parseFloat(c.el.style.left),oy:(e.clientY-sr.top)/scale-parseFloat(c.el.style.top)};
    c.el.classList.add('drag');
  });
  c.el.addEventListener('pointermove',e=>{
    if(!drag||drag.c!==c)return;const sr=S.getBoundingClientRect();
    const x=(e.clientX-sr.left)/scale-drag.ox,y=(e.clientY-sr.top)/scale-drag.oy;
    c.el.style.left=x+'px';c.el.style.top=y+'px';
    const t=target(x,y,c);fields.forEach(f=>f.el.classList.toggle('hover',f===t));
  });
  const end=e=>{
    if(!drag||drag.c!==c)return;c.el.classList.remove('drag');
    const t=target(parseFloat(c.el.style.left),parseFloat(c.el.style.top),c);
    fields.forEach(f=>f.el.classList.remove('hover'));
    if(t)place(c,t);else{fields.forEach(o=>{if(o.card===c)o.card=null});home(c,c.trayPos)}
    drag=null;
  };
  c.el.addEventListener('pointerup',end);c.el.addEventListener('pointercancel',end);
});
function target(x,y,c){
  const w=parseFloat(c.el.style.width)||224, cx=x+w/2, cy=y+30;
  let best=null,bd=1e9;
  fields.forEach(f=>{const fx=f.x+150,fy=f.y+35;const dx=Math.abs(cx-fx),dy=Math.abs(cy-fy);
    if(dx<230&&dy<70){const d=dx*dx+dy*dy*3;if(d<bd){bd=d;best=f}}});
  return best;
}
document.getElementById('pruefen').onclick=()=>{
  let all=true;
  fields.forEach(f=>{const ok=f.card&&f.card.k===f.k;f.el.classList.toggle('ok',!!ok);f.el.classList.toggle('bad',!!f.card&&!ok);
    f.el.querySelector('.mark').textContent=ok?'✓':(f.card?'✗':'');if(!ok)all=false});
  S.classList.add('checking');S.classList.toggle('alldone',all);
};
document.getElementById('reset').onclick=shuffle;
const fb=document.getElementById('farben');
try{fb.checked=localStorage.getItem('farben')==='1'}catch(e){}
const applyF=()=>{S.classList.toggle('farben',fb.checked);try{localStorage.setItem('farben',fb.checked?'1':'0')}catch(e){}};
fb.addEventListener('change',applyF);applyF();
silbenSchalter(document.getElementById('silben'),S,'brief-silben',false);
shuffle();
</script>
</body>
</html>
