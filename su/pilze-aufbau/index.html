<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Pilzaufbau an der Tafel</title>
<style>
/* Grundeinstellungen (wie in der Claude-Vorschau, damit alles gleich aussieht) */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

/* Schrift Andika lokal aus dem Ordner "fonts" (kein Google Fonts). Fehlt die Datei, greift die Ersatzschrift. */
@font-face{font-family:"Andika";src:url("../../fonts/Andika-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Andika";src:url("../../fonts/Andika-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

/* Knopf "Übersicht": siehe ../../gemeinsam/zurueck.css */
</style>
<style>
/* Layout: 16:9-Bühne (1600×900), skaliert auf die Tafel. Feld „Fruchtkörper“ links mit Klammer, Pilzbild in der Mitte, Felder Hut/Stiel/Myzel rechts daneben, Kärtchen-Ablage ganz rechts. Rätsel-Modus legt eine Tafel über die rechte Hälfte. */
:root{
  --room:#dfe5e0; --stage:#ffffff; --ink:#1d2320; --soft:#5d6862; --field:#f3f6f2; --tray:#eef2ee;
  --ok:#2f7d4f; --bad:#c0392b; --btn:#1d2320; --btnfg:#ffffff; --s1:#1f5fbf; --s2:#c8322c;
  --font:"Andika","Comic Sans MS","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--room:#141816;color-scheme:dark}}
:root[data-theme="dark"]{--room:#141816;color-scheme:dark}
html,body{height:100%}
body{background:var(--room);color:var(--ink);font-family:var(--font);margin:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;
  display:grid;place-items:center;user-select:none;-webkit-user-select:none}
#fit{position:relative;width:100%;height:100%}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;background:var(--stage);border-radius:18px;box-shadow:0 6px 30px rgba(0,0,0,.18);transform-origin:0 0;overflow:hidden}

h1{position:absolute;left:48px;top:28px;margin:0;font-size:46px}
.auftrag{position:absolute;left:50px;top:94px;font-size:24px;color:var(--ink)}
.say{border:2px solid var(--ink);border-radius:10px;padding:1px 10px;font-weight:700}

/* Silbenschrift: kommt aus ../../gemeinsam/silben.css (Schalter "Silben") */

#bild{position:absolute;left:340px;top:150px;width:540px;height:720px}
.bracket{position:absolute;left:322px;top:223px;width:16px;height:387px;border:5px solid var(--ink);border-right:none;border-radius:10px 0 0 10px;box-sizing:border-box}
.farben .bracket{border-color:var(--c)}
.link{position:absolute;height:0;border-top:3px dotted var(--ink)}
.link::before{content:"";position:absolute;left:-4px;top:-9px;border-top:7.5px solid transparent;border-bottom:7.5px solid transparent;border-right:11px solid var(--ink)}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translate(-7px,-7px)}

.field{position:absolute;width:300px;height:76px;border:3px dashed var(--ink);border-radius:14px;background:var(--field);box-sizing:border-box;transition:background .15s, box-shadow .15s}
.farben .field{border-color:var(--c);background:var(--cbg)}
.field.hover{background:#e3efe6;box-shadow:0 0 0 4px rgba(47,125,79,.25)}
.field .mark{position:absolute;right:-16px;top:-18px;width:38px;height:38px;border-radius:50%;color:#fff;font-size:24px;font-weight:700;display:none;place-items:center;z-index:5}
.checking .field.ok .mark{display:grid;background:var(--ok)}
.checking .field.bad .mark{display:grid;background:var(--bad)}
.checking .field.ok{border-style:solid;border-color:var(--ok)}
.checking .field.bad{border-style:solid;border-color:var(--bad)}

.tray{position:absolute;left:1270px;top:150px;width:302px;height:520px;background:var(--tray);border-radius:16px;border:2px solid #c9d1cb;box-sizing:border-box}
.tray b{position:absolute;top:14px;width:100%;text-align:center;font-size:22px;color:var(--soft)}
.card{position:absolute;width:284px;height:66px;border:3px solid #1d2320;border-radius:12px;background:#fff;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:30px;font-weight:700;cursor:grab;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.2);
  transition:left .18s ease, top .18s ease, transform .1s;z-index:2}
.farben .card{background:var(--cbg);border-color:var(--c)}
.card.c-frucht{font-size:26px}
.card.drag{cursor:grabbing;transition:none;transform:scale(1.06);z-index:10;box-shadow:0 10px 24px rgba(0,0,0,.28)}

.ctrl{position:absolute;right:28px;top:28px;display:flex;gap:12px;align-items:center}
.ctrl button,.ctrl label{font-family:var(--font);font-size:21px;border-radius:12px;border:2px solid var(--ink);padding:10px 18px;background:#fff;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.ctrl button.main{background:var(--btn);color:var(--btnfg)}
.ctrl button[aria-pressed="true"]{background:#e3f2e8;border-color:var(--ok)}
.ctrl input{width:22px;height:22px;accent-color:#2f7d4f}
button:focus-visible,.ctrl label:focus-within{outline:4px solid #2f7d4f;outline-offset:2px}
.lob{position:absolute;left:1270px;top:700px;width:302px;text-align:center;font-size:30px;font-weight:700;color:var(--ok);display:none}
.alldone .lob{display:block}

/* Rätsel */
.raetsel{position:absolute;left:910px;top:140px;width:666px;height:740px;background:#fffdf6;border:3px solid var(--ink);border-radius:20px;box-sizing:border-box;padding:28px 32px;display:none;flex-direction:column;gap:22px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.mode-raetsel .raetsel{display:flex}
.raetsel h2{margin:0;font-size:34px}
.frage{font-size:40px;font-weight:700;line-height:1.7;min-height:150px;background:#f3f6f2;border-radius:14px;padding:18px 22px}
.antworten{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.antworten button{white-space:nowrap;color:var(--ink);font-family:var(--font);font-size:28px;font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px 10px;cursor:pointer}
.farben .antworten button{background:var(--cbg);border-color:var(--c)}
.antworten button.richtig{border-color:var(--ok);box-shadow:0 0 0 5px rgba(47,125,79,.3)}
.antworten button.falsch{animation:wackel .35s}
@keyframes wackel{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rueck{font-size:28px;font-weight:700;min-height:40px}
.rueck.ok{color:var(--ok)} .rueck.no{color:var(--bad)}
.rbar{display:flex;gap:12px;margin-top:auto}
.rbar button{font-family:var(--font);font-size:22px;border-radius:12px;border:2px solid var(--ink);padding:10px 18px;background:#fff;color:var(--ink);cursor:pointer}
.rbar button.main{background:var(--btn);color:var(--btnfg)}
.zaehler{margin-left:auto;align-self:center;font-size:20px;color:var(--soft)}

.c-hut{--c:#4f9a3a;--cbg:#e6f2e1}.c-stiel{--c:#c8322c;--cbg:#f9e3e1}.c-myzel{--c:#b8920f;--cbg:#fbf3d2}.c-frucht{--c:#2f6fb0;--cbg:#e3eef8}
@media (prefers-reduced-motion: reduce){.card{transition:none}.antworten button.falsch{animation:none}}
</style>

<script>
const S=document.getElementById('stage'), fit=document.getElementById('fit');
const parts=[
 {k:"hut",   wort:"der Hut",           satz:"Das ist der Hut.",           fx:930,fy:259,px:760,py:297},
 {k:"stiel", wort:"der Stiel",         satz:"Das ist der Stiel.",         fx:930,fy:479,px:668,py:517},
 {k:"myzel", wort:"das My-zel",        satz:"Das ist das Myzel.",         fx:930,fy:674,px:790,py:712},
 {k:"frucht",wort:"der Frucht-kör-per",satz:"Das ist der Fruchtkörper.",  fx:16, fy:378,px:null,py:null},
];
const FW=300, FH=76;
const fields=parts.map(p=>{
  if(p.px!==null){
    const d=document.createElement('div');d.className='dot';d.style.left=p.px+'px';d.style.top=p.py+'px';S.appendChild(d);
    const l=document.createElement('div');l.className='link';l.style.left=(p.px+10)+'px';l.style.width=(p.fx-p.px-18)+'px';l.style.top=(p.fy+FH/2)+'px';
    // Linie waagerecht auf Feldhöhe: Punkt liegt auf gleicher Höhe
    S.appendChild(l);
  }
  const f=document.createElement('div');f.className='field c-'+p.k;f.dataset.k=p.k;
  f.style.left=p.fx+'px';f.style.top=p.fy+'px';f.innerHTML='<span class="mark"></span>';S.appendChild(f);
  return {el:f,k:p.k,x:p.fx,y:p.fy,card:null};
});
const cards=parts.map(p=>{const c=document.createElement('div');c.className='card c-'+p.k;c.innerHTML='<span>'+silben(p.wort)+'</span>';c.dataset.k=p.k;c.setAttribute('aria-label',p.wort.replace(/-/g,''));S.appendChild(c);return {el:c,k:p.k,slot:null}});
const TRAY={x:1270,y:150};
function home(c,i){c.slot=null;c.el.style.left=(TRAY.x+9)+'px';c.el.style.top=(TRAY.y+58+i*112)+'px'}
function shuffle(){const idx=[...cards.keys()];for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  fields.forEach(f=>f.card=null);idx.forEach((ci,pos)=>{cards[ci].trayPos=pos;home(cards[ci],pos)});S.classList.remove('checking','alldone');}
function place(c,f){
  if(f.card&&f.card!==c){home(f.card,f.card.trayPos)}
  fields.forEach(o=>{if(o.card===c)o.card=null});
  f.card=c;c.slot=f;c.el.style.left=(f.x+8)+'px';c.el.style.top=(f.y+5)+'px';
  S.classList.remove('checking','alldone');
}
let scale=1;
function resize(){const r=fit.getBoundingClientRect();scale=Math.min(r.width/1600,r.height/900);
  S.style.transform=`scale(${scale})`;S.style.left=((r.width-1600*scale)/2)+'px';S.style.top=((r.height-900*scale)/2)+'px'}
addEventListener('resize',resize);resize();

let drag=null;
cards.forEach(c=>{
  c.el.addEventListener('pointerdown',e=>{
    e.preventDefault();c.el.setPointerCapture(e.pointerId);
    const sr=S.getBoundingClientRect();
    drag={c,ox:(e.clientX-sr.left)/scale-parseFloat(c.el.style.left),oy:(e.clientY-sr.top)/scale-parseFloat(c.el.style.top)};
    c.el.classList.add('drag');
  });
  c.el.addEventListener('pointermove',e=>{
    if(!drag||drag.c!==c)return;const sr=S.getBoundingClientRect();
    const x=(e.clientX-sr.left)/scale-drag.ox,y=(e.clientY-sr.top)/scale-drag.oy;
    c.el.style.left=x+'px';c.el.style.top=y+'px';
    const t=target(x,y);fields.forEach(f=>f.el.classList.toggle('hover',f===t));
  });
  const end=()=>{
    if(!drag||drag.c!==c)return;c.el.classList.remove('drag');
    const t=target(parseFloat(c.el.style.left),parseFloat(c.el.style.top));
    fields.forEach(f=>f.el.classList.remove('hover'));
    if(t)place(c,t);else{fields.forEach(o=>{if(o.card===c)o.card=null});home(c,c.trayPos)}
    drag=null;
  };
  c.el.addEventListener('pointerup',end);c.el.addEventListener('pointercancel',end);
});
function target(x,y){
  const cx=x+142, cy=y+33;let best=null,bd=1e9;
  fields.forEach(f=>{const fx=f.x+FW/2,fy=f.y+FH/2;const dx=Math.abs(cx-fx),dy=Math.abs(cy-fy);
    if(dx<220&&dy<80){const d=dx*dx+dy*dy*3;if(d<bd){bd=d;best=f}}});
  return best;
}
document.getElementById('pruefen').onclick=()=>{
  let all=true;
  fields.forEach(f=>{const ok=f.card&&f.card.k===f.k;f.el.classList.toggle('ok',!!ok);f.el.classList.toggle('bad',!!f.card&&!ok);
    f.el.querySelector('.mark').textContent=ok?'✓':(f.card?'✗':'');if(!ok)all=false});
  S.classList.add('checking');S.classList.toggle('alldone',all);
};
document.getElementById('reset').onclick=shuffle;
const fb=document.getElementById('farben');
try{fb.checked=localStorage.getItem('pilz-farben')==='1'}catch(e){}
const applyF=()=>{S.classList.toggle('farben',fb.checked);try{localStorage.setItem('pilz-farben',fb.checked?'1':'0')}catch(e){}};
fb.addEventListener('change',applyF);applyF();
silbenSchalter(document.getElementById('silben'),S,'pilz-silben',true);
shuffle();

// ===== Rätsel „Wer bin ich?“ (nach dem Arbeitsblatt „Der Aufbau eines Pilzes“) =====
const RAETSEL=[

 {k:"myzel", t:"Ich bin un-ter der Er-de."},

 {k:"myzel", t:"Ich hal-te den Pilz in der Er-de fest."},
 {k:"frucht",t:"Ich bin ü-ber der Er-de."},

];
const NAME={hut:"der Hut",stiel:"der Stiel",myzel:"das Myzel",frucht:"der Fruchtkörper"};
const frage=document.getElementById('frage'),antw=document.getElementById('antworten'),rueck=document.getElementById('rueck'),zaehler=document.getElementById('zaehler');
parts.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='c-'+p.k;b.innerHTML=silben(p.wort);b.dataset.k=p.k;b.setAttribute('aria-label',p.wort.replace(/-/g,''));
  b.onclick=()=>antworte(b);antw.appendChild(b)});
let reihe=[],pos=0,geloest=false;
function mischen(){reihe=[...RAETSEL.keys()];for(let i=reihe.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[reihe[i],reihe[j]]=[reihe[j],reihe[i]]}pos=0}
function zeige(){
  const r=RAETSEL[reihe[pos]];frage.innerHTML=silben(r.t)+' <span class="w">Wer bin ich?</span>';
  rueck.textContent='';rueck.className='rueck';geloest=false;
  [...antw.children].forEach(b=>b.classList.remove('richtig','falsch'));
  zaehler.textContent='Rätsel '+(pos+1)+' von '+RAETSEL.length;
}
function antworte(b){
  if(geloest)return;const r=RAETSEL[reihe[pos]];
  if(b.dataset.k===r.k){b.classList.add('richtig');geloest=true;
    const n=NAME[r.k];rueck.textContent='Richtig! Das ist '+n+'.';rueck.className='rueck ok';}
  else{b.classList.remove('falsch');void b.offsetWidth;b.classList.add('falsch');rueck.textContent='Lies noch einmal genau.';rueck.className='rueck no'}
}
document.getElementById('weiter').onclick=()=>{pos=(pos+1)%reihe.length;if(pos===0)mischen();zeige()};
const rb=document.getElementById('raetselBtn');
function setR(on){S.classList.toggle('mode-raetsel',on);rb.setAttribute('aria-pressed',on);if(on){mischen();zeige()}}
rb.onclick=()=>setR(!S.classList.contains('mode-raetsel'));
document.getElementById('zu').onclick=()=>setR(false);
</script>
